[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bladecam"
version = "0.5.0"
description = "5-axis flank-milling tool-positioning toolkit for impeller blades"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gui = ["PySide6>=6.5", "pyvista>=0.43", "pyvistaqt>=0.11", "matplotlib>=3.7"]
cad = ["cadquery-ocp>=7.7"]   # STEP / IGES import

[project.scripts]
bladecam-demo = "demo:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["bladecam*"]

# NOTE: the Fortran core (libbladecam) is built separately with CMake; see
# README. Set BLADECAM_LIB or place the build under bladecam/build/core.
