    if (+pp[0] === 3) occupiedAtRow3[+pp[1]] = true;
  }
  var connectorOptions = topHCols.filter(function (c) { return !occupiedAtRow3[c]; });
  if (!connectorOptions.length) connectorOptions = topHCols; // fall back if no clean choice
  var connectorCol = connectorOptions[Math.floor(Math.random() * connectorOptions.length)];

  // Where does connectorCol sit within the new hEq? Random {0,1,2}
  var hOffset = Math.floor(Math.random() * 3);
  var hStartCol = connectorCol - hOffset;

  // Shift everything right if hStartCol < 0
  if (hStartCol < 0) {
    var shift = -hStartCol;
    function shiftRight(k) {
      var pp = k.split(','); return (+pp[0]) + ',' + ((+pp[1]) + shift);
    }
    p.layout.cells = p.layout.cells.map(shiftRight);
    for (var eii = 0; eii < p.layout.equations.length; eii++) {
      var eq = p.layout.equations[eii];
      if (!eq.cells || !eq.cells.length) continue;
      eq.cells = eq.cells.map(shiftRight);
    }
    var nv = {}, ng = {}, np = {}, ns = {};
    for (var vk in p.puzzle.values) nv[shiftRight(vk)] = p.puzzle.values[vk];
    for (var gk in p.givens) if (p.givens[gk]) ng[shiftRight(gk)] = true;
    for (var pk in state.placed) if (state.placed[pk] != null) np[shiftRight(pk)] = state.placed[pk];
    for (var sk in state.settledCells) if (state.settledCells[sk]) ns[shiftRight(sk)] = true;
    p.puzzle.values = nv; p.givens = ng; state.placed = np; state.settledCells = ns;
    connectorCol += shift;
    hStartCol = 0;
  }

  // Anchor cell (bottom of new vEq) is in existing top hEq
  var anchorCellKey = '2,' + connectorCol;
  if (p.layout.cells.indexOf(anchorCellKey) === -1) return;
  var anchorValue = p.puzzle.values[anchorCellKey];
  if (anchorValue == null) return;

  // Pick op + values for the new vEq: top op middle = bottom (= anchorValue)
  var cfg = DIFFICULTY[state.difficulty];
  var vop = null;
  for (var va = 0; va < 200; va++) {
    var v_op = (Math.random() < cfg.minusChance) ? '−' : '+';
    var v_top = 1 + Math.floor(Math.random() * Math.min(cfg.poolMax, cfg.maxNum - 1));
    var v_mid;
    if (v_op === '+') v_mid = anchorValue - v_top;
    else v_mid = v_top - anchorValue;
    if (!Number.isInteger(v_mid) || v_mid < 1 || v_mid > cfg.maxNum) continue;
    if (v_top < 1 || v_top > cfg.maxNum) continue;
    vop = { op: v_op, top: v_top, mid: v_mid };
    break;
  }
  if (!vop) return;

  // Pick op + values for new hEq, with cell at hOffset position = vop.top
  var hop = null;
  for (var ha = 0; ha < 200; ha++) {
    var h_op = (Math.random() < cfg.minusChance) ? '−' : '+';
    var v0, v1, v2;
    var rand = function () { return 1 + Math.floor(Math.random() * Math.min(cfg.poolMax, cfg.maxNum - 1)); };
    if (hOffset === 0) {
      v0 = vop.top; v1 = rand();
      v2 = (h_op === '+') ? v0 + v1 : v0 - v1;
    } else if (hOffset === 1) {
      v1 = vop.top; v0 = rand();
      v2 = (h_op === '+') ? v0 + v1 : v0 - v1;
    } else {
      v2 = vop.top; v0 = rand();
      v1 = (h_op === '+') ? v2 - v0 : v0 - v2;
    }
    var ok = [v0, v1, v2].every(function (v) { return Number.isInteger(v) && v >= 1 && v <= cfg.maxNum; });
    if (!ok) continue;
    hop = { op: h_op, vals: [v0, v1, v2] };
    break;
  }
  if (!hop) return;

  // Commit cells + values
  var newHCells = [];
  for (var hi3 = 0; hi3 < 3; hi3++) {
    var k = '0,' + (hStartCol + hi3);
    newHCells.push(k);
    p.layout.cells.push(k);
    p.puzzle.values[k] = hop.vals[hi3];
  }
  var connectorCellKey = '1,' + connectorCol;
  p.layout.cells.push(connectorCellKey);
  p.puzzle.values[connectorCellKey] = vop.mid;

  // Add equations
  var newHEqIdx = p.layout.equations.length;
  p.layout.equations.push({ cells: newHCells, orientation: 'h' });
  p.puzzle.eqOps.push([hop.op]);
  var newVEqIdx = p.layout.equations.length;
  p.layout.equations.push({
    cells: ['0,' + connectorCol, connectorCellKey, anchorCellKey],
    orientation: 'v'
  });
  p.puzzle.eqOps.push([vop.op]);

  // Givens follow the stacked-puzzle convention: vEq endpoints (top + bottom)
  // are given so each hEq is independently solvable. vEq middle is NOT given.
  // - newHCells[hOffset] = top of vEq → given (vEq endpoint)
  // - one of the OTHER hEq cells → given (so hEq has 2 givens)
  // - the remaining hEq cell + connector cell → not given (filled from bank)
  p.givens[newHCells[hOffset]] = true;
  var otherIndices = [0, 1, 2].filter(function (i) { return i !== hOffset; });
  var givenOtherIdx = otherIndices[Math.floor(Math.random() * otherIndices.length)];
  p.givens[newHCells[givenOtherIdx]] = true;
  // Connector cell (vEq middle) intentionally NOT given.

  // Bank tiles for the 2 non-given new cells
  var nonGivenHIdx = otherIndices.filter(function (i) { return i !== givenOtherIdx; })[0];
  state.bank.push(hop.vals[nonGivenHIdx]);
  state.bank.push(vop.mid);
  state.bank.sort(function (a, b) { return a - b; });

  // Layer metadata: new top has empty vEqIndicesUp; existing top (now at row 2)
  // gets the new vEq added to its vEqIndicesUp.
  p.layout.layers.unshift({ row: 0, hEqIndices: [newHEqIdx], vEqIndicesUp: [] });
  for (var lk = 1; lk < p.layout.layers.length; lk++) {
    if (p.layout.layers[lk].row === 2) {
      p.layout.layers[lk].vEqIndicesUp.push(newVEqIdx);
      break;
    }
  }

  // Slide-in animation tags
  state.arcadeIncomingCells = state.arcadeIncomingCells || {};
  for (var ic = 0; ic < newHCells.length; ic++) {
    state.arcadeIncomingCells[newHCells[ic]] = { fromX: '0px', fromY: '-60px' };
  }
  state.arcadeIncomingCells[connectorCellKey] = { fromX: '0px', fromY: '-60px' };

  // SAFETY NET: verify the resulting state is bank-supply consistent.
  // For every non-given cell (across the WHOLE current puzzle), the bank must
  // have enough tiles to cover what's needed minus what's already placed. If
  // not, roll back the spawn so the player isn't stranded with an unsolvable
  // equation. (Found in v44b: edge case where existing cell values combined
  // with newly spawned values exceed bank supply for some value.)
  var needAfter = {}, haveAfter = {};
  for (var cci = 0; cci < p.layout.cells.length; cci++) {
    var ck = p.layout.cells[cci];
    if (!p.givens[ck] && state.placed[ck] == null) {
      var nv = p.puzzle.values[ck];
      needAfter[nv] = (needAfter[nv] || 0) + 1;
    }
  }
  for (var bi = 0; bi < state.bank.length; bi++) {
    haveAfter[state.bank[bi]] = (haveAfter[state.bank[bi]] || 0) + 1;
  }
  // Subtract placed values (those tiles are "consumed")
  for (var pkk in state.placed) {
    if (state.placed[pkk] != null && haveAfter[state.placed[pkk]]) {
      haveAfter[state.placed[pkk]]--;
    }
  }
  var bankShortfall = false;
  for (var nvk in needAfter) {
    if ((haveAfter[nvk] || 0) < needAfter[nvk]) { bankShortfall = true; break; }
  }
  if (bankShortfall) {
    // Roll back: remove the new cells, equations, givens, bank tiles, and layer.
    var rollbackKeys = newHCells.concat([connectorCellKey]);
    var rbSet = {};
    for (var rk = 0; rk < rollbackKeys.length; rk++) rbSet[rollbackKeys[rk]] = true;
    p.layout.cells = p.layout.cells.filter(function (k) { return !rbSet[k]; });
    for (var rkk in rbSet) {
      delete p.puzzle.values[rkk];
      delete p.givens[rkk];
      delete state.arcadeIncomingCells[rkk];
    }
    // Pop the 2 bank tiles we added (last 2)
    state.bank.pop(); state.bank.pop();
    state.bank.sort(function (a, b) { return a - b; });
    // Remove the 2 equations we appended (newVEqIdx, newHEqIdx — last 2)
    p.layout.equations.pop(); p.layout.equations.pop();
    p.puzzle.eqOps.pop(); p.puzzle.eqOps.pop();
    // Remove the new top layer + un-attach vEq from existing top
    p.layout.layers.shift();
    for (var lkk = 0; lkk < p.layout.layers.length; lkk++) {
      var idx = p.layout.layers[lkk].vEqIndicesUp.indexOf(newVEqIdx);
      if (idx !== -1) p.layout.layers[lkk].vEqIndicesUp.splice(idx, 1);
    }
  }
}

/* ARCADE: replace a solved equation with a fresh one anchored to a cell on the grid.
   This is what gives arcade mode its "Tetris" feel — solved layers vanish, new ones
   slide in to take their place. The puzzle state is mutated in-place. */
function replaceArcadeEquation(oldEqIdx) {
  var p = state.data;
  var oldEq = p.layout.equations[oldEqIdx];
  if (!oldEq) return;

  // Step 1: collect cells that belong to other (non-cleared) equations — those stay
  // on the grid as anchors. Cells that ONLY belonged to this equation will be removed.
  var staysCells = {};
  for (var ei = 0; ei < p.layout.equations.length; ei++) {
    if (state.clearedEqs[ei]) continue;
    var eq = p.layout.equations[ei];
    for (var ci = 0; ci < eq.cells.length; ci++) staysCells[eq.cells[ci]] = true;
  }
  var removedCells = [];
  for (var ci2 = 0; ci2 < oldEq.cells.length; ci2++) {
    var k = oldEq.cells[ci2];
    if (!staysCells[k]) removedCells.push(k);
  }

  // Step 2: find an anchor — a cell that survives, currently has a value, and has at
  // least one empty grid neighbor where we could extend a new equation.
  var anchorCandidates = [];
  for (var k2 in staysCells) {
    if (cellValue(k2) == null) continue;
    var directions = getFreeDirections(k2);
    if (directions.length > 0) {
      anchorCandidates.push({ key: k2, directions: directions, value: cellValue(k2) });
    }
  }

  // No anchor available → just remove the cleared equation without replacement.
  // The arcade run essentially ends if no replacements can be added; the player can
  // still solve any remaining equations.
  if (anchorCandidates.length === 0 || removedCells.length === 0) {
    cleanupRemovedCells(removedCells, oldEqIdx);
    return;
  }

  // Step 3: try anchor candidates until we find a valid replacement.
  // Each tried anchor + direction = a candidate placement for a new triplet.
  var cfg = DIFFICULTY[state.difficulty];
  shuffle(anchorCandidates);

  for (var ac = 0; ac < anchorCandidates.length; ac++) {
    var anchor = anchorCandidates[ac];
    shuffle(anchor.directions);
    for (var dd = 0; dd < anchor.directions.length; dd++) {
      var dir = anchor.directions[dd];  // 'h' or 'v'
      // The new triplet has 3 cells along `dir`. The anchor cell is one of them.
      // Try anchor at position 0, 1, or 2 in the new triplet.
      for (var anchorPos = 0; anchorPos < 3; anchorPos++) {
        var newKeys = computeNewKeys(anchor.key, dir, anchorPos);
        if (!newKeys) continue;
        // Verify ALL non-anchor cells are not currently on the grid (so we don't conflict)
        var conflict = false;
        for (var nki = 0; nki < newKeys.length; nki++) {
          if (nki === anchorPos) continue;
          var nk = newKeys[nki];
          // It may exist as a removed cell — that's fine (we'll re-use the slot).
          // It must NOT currently belong to a non-cleared equation.
          if (staysCells[nk]) { conflict = true; break; }
          // Anti-chain: this cell must not be horizontally/vertically adjacent to
          // ANOTHER active cell (other than its own equation neighbors)
          if (hasUnrelatedNeighbor(nk, newKeys, staysCells)) { conflict = true; break; }
        }
        if (conflict) continue;

        // Generate values for the new triplet that fit (anchor.value at anchorPos)
        var newValuesAndOp = pickValuesForArcade(anchorPos, anchor.value, cfg);
        if (!newValuesAndOp) continue;

        // Pre-solve check: simulate the install in a snapshot, verify the resulting
        // puzzle state is fully solvable (bank-supply + deducibility).
        var validated = simulateAndValidateArcadeReplacement(oldEqIdx, removedCells, newKeys, anchorPos, anchor.key, newValuesAndOp);
        if (!validated) continue;

        // Commit: install the new equation using the validated given/empty positions
        installArcadeEquation(oldEqIdx, removedCells, newKeys, anchorPos, anchor.key, newValuesAndOp, validated.givenPos, validated.emptyPos);
        return;
      }
    }
  }

  // Couldn't find a placement; just remove the old eq.
  cleanupRemovedCells(removedCells, oldEqIdx);
}

function getFreeDirections(cellKey) {
  // Cell at (r, c). Direction "h" needs cells (r, c±1, c±2) to be empty.
  // Direction "v" needs cells (r±1..r±2, c) to be empty.
  // Returns directions where the cell could anchor a new triplet.
  var p = state.data;
  var occupiedKeys = {};
  for (var ei = 0; ei < p.layout.equations.length; ei++) {
    if (state.clearedEqs[ei]) continue;
    var eq = p.layout.equations[ei];
    if (!eq.cells || eq.cells.length === 0) continue;
    for (var ci = 0; ci < eq.cells.length; ci++) occupiedKeys[eq.cells[ci]] = true;
  }
  var pp = cellKey.split(',');
  var r = +pp[0], c = +pp[1];
  var dirs = [];
  // Horizontal: at least 2 free cells in some triplet position aligned with this cell
  for (var hOff = -2; hOff <= 0; hOff++) {
    var allFree = true;
    for (var i = 0; i < 3; i++) {
      var key = r + ',' + (c + hOff + i);
      if (key === cellKey) continue;
      if (occupiedKeys[key]) { allFree = false; break; }
    }
    if (allFree) { dirs.push('h'); break; }
  }
  for (var vOff = -2; vOff <= 0; vOff++) {
    var allFree2 = true;
    for (var i2 = 0; i2 < 3; i2++) {
      var key2 = (r + vOff + i2) + ',' + c;
      if (key2 === cellKey) continue;
      if (occupiedKeys[key2]) { allFree2 = false; break; }
    }
    if (allFree2) { dirs.push('v'); break; }
  }
  return dirs;
}

function simulateAndValidateArcadeReplacement(oldEqIdx, removedCells, newKeys, anchorPos, anchorKey, vop) {
  var p = state.data;

  // Build a snapshot of the layout AFTER install:
  // - Removed cells gone from layout.cells
  // - New cells added to layout.cells
  // - Equation at oldEqIdx replaced with new triplet
  // - Anchor and given (one of the two non-anchor positions) have known values
  // - Empty (the other) is the only unknown in the new equation

  // Decide given/empty positions the same way installArcadeEquation does (any non-anchor pos)
  var nonAnchorPositions = [];
  for (var npi = 0; npi < newKeys.length; npi++) if (npi !== anchorPos) nonAnchorPositions.push(npi);
  // For validation, we just need to verify ANY assignment of given/empty works.
  // Try both options; if EITHER is fully solvable, we accept (the actual install
  // will pick one randomly).
  for (var givenPosTry = 0; givenPosTry < nonAnchorPositions.length; givenPosTry++) {
    var givenPos = nonAnchorPositions[givenPosTry];
    var emptyPos = nonAnchorPositions[1 - givenPosTry];

    // Build snapshot
    var snapCells = p.layout.cells.slice();
    var removedSet = {};
    for (var rci = 0; rci < removedCells.length; rci++) removedSet[removedCells[rci]] = true;
    snapCells = snapCells.filter(function(k){ return !removedSet[k]; });
    for (var nki = 0; nki < newKeys.length; nki++) {
      if (nki === anchorPos) continue;
      if (snapCells.indexOf(newKeys[nki]) === -1) snapCells.push(newKeys[nki]);
    }

    var snapEquations = p.layout.equations.slice();
    snapEquations[oldEqIdx] = {
      cells: newKeys,
      orientation: (newKeys[0].split(',')[0] === newKeys[1].split(',')[0]) ? 'h' : 'v'
    };

    var snapValues = {};
    for (var k in p.puzzle.values) {
      if (!removedSet[k]) snapValues[k] = p.puzzle.values[k];
    }
    for (var nki2 = 0; nki2 < newKeys.length; nki2++) {
      if (nki2 === anchorPos) continue;
      snapValues[newKeys[nki2]] = vop.values[nki2];
    }

    var snapEqOps = p.puzzle.eqOps.slice();
    snapEqOps[oldEqIdx] = [vop.op];

    // Givens: existing givens, minus removed cells, plus the anchor (treated as "known"
    // because its value is placed) and the new given cell.
    var snapGivens = {};
    for (var gk in p.givens) {
      if (p.givens[gk] && !removedSet[gk]) snapGivens[gk] = true;
    }
    // Treat anchor as "given" for purposes of solver (its value IS known/placed)
    snapGivens[anchorKey] = true;
    // The new given clue
    snapGivens[newKeys[givenPos]] = true;
    // Treat all CURRENTLY-PLACED cells as "given" for solver (their values are known)
    for (var pk in state.placed) {
      if (state.placed[pk] != null && !removedSet[pk]) {
        snapGivens[pk] = true;
        snapValues[pk] = state.placed[pk]; // ensure correct value used
      }
    }

    var snapLayout = { cells: snapCells, equations: snapEquations };
    var snapPuzzle = { values: snapValues, eqOps: snapEqOps };

    // Filter to active equations (skip cleared/empty)
    var activeEquations = [];
    var activeOps = [];
    var origToNewIdx = {};
    for (var sei = 0; sei < snapEquations.length; sei++) {
      if (state.clearedEqs[sei] && sei !== oldEqIdx) continue;
      var seq = snapEquations[sei];
      if (!seq.cells || seq.cells.length === 0) continue;
      origToNewIdx[sei] = activeEquations.length;
      activeEquations.push(seq);
      activeOps.push(snapEqOps[sei]);
    }
    snapLayout.equations = activeEquations;
    snapPuzzle.eqOps = activeOps;

    // Bank-supply check: simulated bank = current bank + new tile for empty cell.
    // For each non-given (non-snapGivens) cell remaining, count its needed value.
    var simulatedBank = state.bank.slice();
    simulatedBank.push(vop.values[emptyPos]);
    var needCounts = {};
    var bankCounts = {};
    for (var sci = 0; sci < snapCells.length; sci++) {
      var sk = snapCells[sci];
      if (!snapGivens[sk]) {
        var sv = snapValues[sk];
        needCounts[sv] = (needCounts[sv] || 0) + 1;
      }
    }
    for (var sbi = 0; sbi < simulatedBank.length; sbi++) {
      bankCounts[simulatedBank[sbi]] = (bankCounts[simulatedBank[sbi]] || 0) + 1;
    }
    // Account for already-placed values consuming bank tiles
    for (var pk2 in state.placed) {
      if (state.placed[pk2] != null && !removedSet[pk2]) {
        // placed value was already drawn from the bank; remove from bankCounts
        var pv = state.placed[pk2];
        if (bankCounts[pv]) bankCounts[pv]--;
      }
    }
    var bankOk = true;
    for (var nv in needCounts) {
      if ((bankCounts[nv] || 0) < needCounts[nv]) { bankOk = false; break; }
    }
    if (!bankOk) continue; // try next given/empty assignment

    // Deducibility check
    var ded = isDeducible(snapLayout, snapPuzzle, snapGivens);
    if (!ded.ok) continue;

    // OK, this assignment of given/empty is valid — return it
    return { givenPos: givenPos, emptyPos: emptyPos };
  }
  return null; // no valid assignment found
}

function computeNewKeys(anchorKey, dir, anchorPos) {
  var pp = anchorKey.split(',');
  var r = +pp[0], c = +pp[1];
  var keys = [];
  for (var i = 0; i < 3; i++) {
    var off = i - anchorPos;
    var nr = r, nc = c;
    if (dir === 'h') nc = c + off;
    else nr = r + off;
    if (nr < 0 || nc < 0) return null; // out of bounds
    keys.push(nr + ',' + nc);
  }
  return keys;
}

function hasUnrelatedNeighbor(cellKey, newKeys, occupiedKeys) {
  // The new cell shouldn't sit immediately adjacent (above/below/left/right) to a cell
  // that belongs to a different equation, except for the anchor itself.
  var pp = cellKey.split(',');
  var r = +pp[0], c = +pp[1];
  var neighbors = [
    (r-1) + ',' + c, (r+1) + ',' + c,
    r + ',' + (c-1), r + ',' + (c+1)
  ];
  for (var ni = 0; ni < neighbors.length; ni++) {
    var nkey = neighbors[ni];
    if (newKeys.indexOf(nkey) !== -1) continue; // own equation neighbor — fine
    if (occupiedKeys[nkey]) return true;
  }
  return false;
}

function pickValuesForArcade(anchorPos, anchorValue, cfg) {
  // Pick values v0, v1, v2 such that v0 op v1 = v2, with the anchor at anchorPos.
  var allowMulDiv = !!(state && state.settings && state.settings.mulDiv);
  for (var attempt = 0; attempt < 200; attempt++) {
    var op;
    if (allowMulDiv) {
      if (R() < 0.5) op = R() < cfg.minusChance ? '−' : '+';
      else op = R() < 0.5 ? '×' : '÷';
    } else {
      op = R() < cfg.minusChance ? '−' : '+';
    }
    var v0, v1, v2;

    if (op === '+' || op === '−') {
      if (anchorPos === 0) {
        v0 = anchorValue;
        v1 = 1 + Math.floor(R() * Math.min(cfg.poolMax, cfg.maxNum - 1));
        v2 = applyOp(v0, op, v1);
      } else if (anchorPos === 1) {
        v1 = anchorValue;
        v0 = 1 + Math.floor(R() * Math.min(cfg.poolMax, cfg.maxNum - 1));
        v2 = applyOp(v0, op, v1);
      } else {
        v2 = anchorValue;
        v0 = 1 + Math.floor(R() * Math.min(cfg.poolMax, cfg.maxNum - 1));
        v1 = (op === '+') ? v2 - v0 : v0 - v2;
      }
    } else if (op === '×') {
      // v0 × v1 = v2; need v2 ≤ maxNum
      var maxFactor = Math.floor(Math.sqrt(cfg.maxNum));
      if (anchorPos === 0) {
        v0 = anchorValue;
        if (v0 < 2) continue;
        var maxV1 = Math.floor(cfg.maxNum / v0);
        if (maxV1 < 2) continue;
        v1 = 2 + rndInt(Math.max(1, maxV1 - 1));
        v2 = v0 * v1;
      } else if (anchorPos === 1) {
        v1 = anchorValue;
        if (v1 < 2) continue;
        var maxV0 = Math.floor(cfg.maxNum / v1);
        if (maxV0 < 2) continue;
        v0 = 2 + rndInt(Math.max(1, maxV0 - 1));
        v2 = v0 * v1;
      } else {
        v2 = anchorValue;
        if (v2 < 4) continue; // need at least 2×2 = 4
        // Find divisors of v2 to use as v0
        var divisors = [];
        for (var d = 2; d <= maxFactor; d++) if (v2 % d === 0) divisors.push(d);
        if (divisors.length === 0) continue;
        v0 = divisors[rndInt(divisors.length)];
        v1 = v2 / v0;
      }
    } else if (op === '÷') {
      // v0 ÷ v1 = v2; equivalent to v0 = v1 × v2
      if (anchorPos === 0) {
        v0 = anchorValue;
        if (v0 < 4) continue;
        var divs = [];
        for (var dd = 2; dd <= Math.floor(Math.sqrt(v0)); dd++) if (v0 % dd === 0) divs.push(dd);
        if (divs.length === 0) continue;
        v1 = divs[rndInt(divs.length)];
        v2 = v0 / v1;
      } else if (anchorPos === 1) {
        v1 = anchorValue;
        if (v1 < 2) continue;
        var maxQ = Math.floor(cfg.maxNum / v1);
        if (maxQ < 2) continue;
        v2 = 2 + rndInt(Math.max(1, maxQ - 1));
        v0 = v1 * v2;
      } else {
        v2 = anchorValue;
        if (v2 < 2) continue;
        var maxDivisor = Math.floor(cfg.maxNum / v2);
        if (maxDivisor < 2) continue;
        v1 = 2 + rndInt(Math.max(1, maxDivisor - 1));
        v0 = v1 * v2;
      }
    }

    if (!Number.isInteger(v0) || v0 < 1 || v0 > cfg.maxNum) continue;
    if (!Number.isInteger(v1) || v1 < 1 || v1 > cfg.maxNum) continue;
    if (!Number.isInteger(v2) || v2 < 1 || v2 > cfg.maxNum) continue;
    // Verify the equation actually holds (defensive)
    if (applyOp(v0, op, v1) !== v2) continue;
    return { values: [v0, v1, v2], op: op };
  }
  return null;
}

function installArcadeEquation(oldEqIdx, removedCells, newKeys, anchorPos, anchorKey, vop, givenPos, emptyPos) {
  var p = state.data;
  delete state.settledCells[anchorKey];
  // Remember where collapse happened for shockwave + slide-from origin
  var anchorPP = anchorKey.split(',');
  var anchorR = +anchorPP[0], anchorC = +anchorPP[1];
  // Remove cells that no longer belong to any active equation
  for (var rc = 0; rc < removedCells.length; rc++) {
    var rk = removedCells[rc];
    delete p.puzzle.values[rk];
    delete p.givens[rk];
    delete state.placed[rk];
    delete state.settledCells[rk];
    var idxInList = p.layout.cells.indexOf(rk);
    if (idxInList >= 0) p.layout.cells.splice(idxInList, 1);
  }
  // If caller didn't specify, fall back to random choice (legacy callers)
  if (givenPos === undefined || emptyPos === undefined) {
    var nonAnchorPositions = [];
    for (var npi = 0; npi < newKeys.length; npi++) if (npi !== anchorPos) nonAnchorPositions.push(npi);
    shuffle(nonAnchorPositions);
    givenPos = nonAnchorPositions[0];
    emptyPos = nonAnchorPositions[1];
  }

  // Add new cells
  for (var nki = 0; nki < newKeys.length; nki++) {
    var nk = newKeys[nki];
    if (nki === anchorPos) continue;
    if (p.layout.cells.indexOf(nk) === -1) p.layout.cells.push(nk);
    p.puzzle.values[nk] = vop.values[nki];
    delete state.placed[nk];
    delete state.settledCells[nk];
    if (nki === givenPos) {
      p.givens[nk] = true;
    } else {
      delete p.givens[nk];
    }
    // Tag this cell as incoming so render's slide-in animation kicks in.
    // Compute slide-from offset: cells slide IN from beyond the grid edge,
    // along the equation's growth direction, with a slight outward arc.
    var nkPP = nk.split(',');
    var nkR = +nkPP[0], nkC = +nkPP[1];
    var dx = (nkC - anchorC) * 60; // slide horizontally if equation is horizontal
    var dy = (nkR - anchorR) * 60; // slide vertically if equation is vertical
    state.arcadeIncomingCells[nk] = { fromX: dx + 'px', fromY: dy + 'px' };
  }
  // Replace the old equation
  p.layout.equations[oldEqIdx] = { cells: newKeys, orientation: (newKeys[0].split(',')[0] === newKeys[1].split(',')[0]) ? 'h' : 'v' };
  p.puzzle.eqOps[oldEqIdx] = [vop.op];
  delete state.clearedEqs[oldEqIdx];

  // Bank update: add ONE tile for the empty cell only
  state.bank.push(vop.values[emptyPos]);
  state.bank.sort(function(a,b){ return a - b; });

  recomputeBounds(p.layout);
  state.visual = buildVisualGrid(p.layout, p.puzzle);

  // Spawn a shockwave from the collapse center (the anchor cell's screen position)
  // We need to compute screen coords AFTER the next render. Schedule for after.
  var anchorKeyForShockwave = anchorKey;
  setTimeout(function () {
    spawnShockwave(anchorKeyForShockwave);
  }, 50);
}

function spawnShockwave(anchorKey) {
  var anchorEl = document.querySelector('[data-cell-key="' + anchorKey + '"]');
  if (!anchorEl) return;
  var rect = anchorEl.getBoundingClientRect();
  var wave = document.createElement('div');
  wave.className = 'shockwave';
  wave.style.left = (rect.left + rect.width / 2) + 'px';
  wave.style.top = (rect.top + rect.height / 2) + 'px';
  document.body.appendChild(wave);
  setTimeout(function () { if (wave.parentNode) wave.parentNode.removeChild(wave); }, 750);
}

function cleanupRemovedCells(removedCells, oldEqIdx) {
  var p = state.data;
  for (var rc = 0; rc < removedCells.length; rc++) {
    var rk = removedCells[rc];
    delete p.puzzle.values[rk];
    delete p.givens[rk];
    delete state.placed[rk];
    delete state.settledCells[rk];
    var idxInList = p.layout.cells.indexOf(rk);
    if (idxInList >= 0) p.layout.cells.splice(idxInList, 1);
  }
  // Remove the equation entirely (mark with empty cells so it's skipped)
  p.layout.equations[oldEqIdx] = { cells: [], orientation: 'h' };
  p.puzzle.eqOps[oldEqIdx] = [];
  delete state.clearedEqs[oldEqIdx];
  recomputeBounds(p.layout);
  state.visual = buildVisualGrid(p.layout, p.puzzle);
}

function recomputeBounds(layout) {
  var maxR = 0, maxC = 0;
  for (var ci = 0; ci < layout.cells.length; ci++) {
    var pp = layout.cells[ci].split(',');
    if (+pp[0] > maxR) maxR = +pp[0];
    if (+pp[1] > maxC) maxC = +pp[1];
  }
  layout.rows = maxR + 1;
  layout.cols = maxC + 1;
}

function flashScoreBump() {
  setTimeout(function () {
    var el = document.querySelector('.score-display');
    if (el) {
      el.classList.add('bump');
      setTimeout(function () { if (el) el.classList.remove('bump'); }, 250);
    }
  }, 50);
}

function spawnScorePop(eq, points, isCrossmath) {
  // Find the visual center of the equation
  var midKey = eq.cells[1];
  var visualKey = parseInt(midKey.split(',')[0]) * 2 + ',' + parseInt(midKey.split(',')[1]) * 2;
  setTimeout(function () {
    var cellEl = document.querySelector('[data-cell-key="' + midKey + '"]');
    if (!cellEl) return;
    var rect = cellEl.getBoundingClientRect();
    var pop = document.createElement('div');
    pop.className = 'score-pop' + (isCrossmath ? ' crossmath' : '');
    pop.style.left = (rect.left + rect.width / 2) + 'px';
    pop.style.top = (rect.top + rect.height / 2) + 'px';
    pop.textContent = (isCrossmath ? '✦ +' : '+') + points + (state.multiplier > 1 ? ' ×' + state.multiplier : '');
    document.body.appendChild(pop);
    setTimeout(function () { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 1100);
  }, 100);
}

function animateEquationClear(eq, isCrossmath, delayMs) {
  delayMs = delayMs || 0;
  setTimeout(function () {
    // Phase 1: flash all cells in the equation (briefly scale up + bright green glow)
    var cellEls = [];
    for (var ci = 0; ci < eq.cells.length; ci++) {
      var cellEl = document.querySelector('[data-cell-key="' + eq.cells[ci] + '"]');
      if (cellEl) { cellEl.classList.add('flashing'); cellEls.push(cellEl); }
    }
    // Phase 2: spark burst from center
    var midKey = eq.cells[1];
    var midEl = document.querySelector('[data-cell-key="' + midKey + '"]');
    if (midEl) {
      var rect = midEl.getBoundingClientRect();
      spawnSparkBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, isCrossmath ? 24 : 14);
    }
    // Phase 3: after the flash finishes (~350ms), trigger the collapse animation
    setTimeout(function () {
      for (var i = 0; i < cellEls.length; i++) {
        cellEls[i].classList.remove('flashing');
        cellEls[i].classList.add('collapsing');
      }
    }, 320);
  }, delayMs);
}

function spawnSparkBurst(x, y, count) {
  var burst = document.createElement('div');
  burst.className = 'spark-burst';
  burst.style.left = x + 'px';
  burst.style.top = y + 'px';
  document.body.appendChild(burst);
  var colors = ['#6a8e3d', '#c89849', '#ffce3a', '#5fe663', '#ffffff'];
  for (var i = 0; i < count; i++) {
    var ang = (i / count) * Math.PI * 2 + Math.random() * 0.3;
    var dist = 50 + Math.random() * 40;
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.setProperty('--px', (Math.cos(ang) * dist) + 'px');
    p.style.setProperty('--py', (Math.sin(ang) * dist) + 'px');
    p.style.setProperty('--p-color', colors[i % colors.length]);
    p.style.animationDelay = (Math.random() * 0.05) + 's';
    burst.appendChild(p);
  }
  setTimeout(function () { if (burst.parentNode) burst.parentNode.removeChild(burst); }, 1100);
}
function triggerShake() {
  state.shake = true; render();
  setTimeout(function () { state.shake = false; render(); }, 500);
}

/* ========================================================================
   PLACEMENT
======================================================================== */
function handleCellTap(key) {
  if (isSolved()) return;
  if (state.data.givens[key]) return;
  if (state.settledCells[key]) return; // locked
  if (state.placed[key] != null) {
    pushHistory();
    delete state.placed[key];
    state.selected = key;
    state.lastFilledKey = null;
    render(); checkAndCelebrate();
  } else {
    state.selected = key;
    render();
  }
}
function handleBankTap(num) {
  if (isSolved()) return;
  var target = state.selected;
  // No auto-pick: if no valid cell is selected, tapping a bank number does nothing.
  // The user picks where each number goes.
  if (target == null || state.data.givens[target] || state.placed[target] != null || state.settledCells[target]) {
    // Visual nudge: briefly pulse the bank tile to indicate "select a cell first"
    var tile = document.querySelector('.bank-tile[data-num="' + num + '"]');
    if (tile) {
      tile.classList.add('reject');
      setTimeout(function() { if (tile) tile.classList.remove('reject'); }, 320);
    }
    return;
  }
  // Refuse if all copies of `num` are already placed elsewhere on the board.
  var totalInBank = 0;
  for (var bi = 0; bi < state.bank.length; bi++) if (state.bank[bi] === num) totalInBank++;
  var alreadyPlaced = 0;
  for (var pk in state.placed) if (state.placed[pk] === num) alreadyPlaced++;
  if (alreadyPlaced >= totalInBank) {
    var tile2 = document.querySelector('.bank-tile[data-num="' + num + '"]');
    if (tile2) {
      tile2.classList.add('reject');
      setTimeout(function() { if (tile2) tile2.classList.remove('reject'); }, 320);
    }
    flashCellsWithValue(num);
    return;
  }
  pushHistory();
  if (state.placed[target] === num) { state.history.pop(); return; }
  state.placed[target] = num;
  state.lastFilledKey = target;
  // Clear selection — user picks the next cell themselves
  state.selected = null;
  soundClick();
  render();
  detectEquationClears(target);
  checkAndCelebrate();
}

function flashCellsWithValue(num) {
  // Find all cells on the board with this value (placed or given) and flash them
  if (!state.data) return;
  var keys = [];
  for (var i = 0; i < state.data.layout.cells.length; i++) {
    var k = state.data.layout.cells[i];
    var v = cellValue(k);
    if (v === num) keys.push(k);
  }
  for (var ki = 0; ki < keys.length; ki++) {
    var cellEl = document.querySelector('[data-cell-key="' + keys[ki] + '"]');
    if (cellEl) {
      cellEl.classList.add('value-locator');
      (function(el) {
        setTimeout(function () { if (el) el.classList.remove('value-locator'); }, 700);
      })(cellEl);
    }
  }
}

/* ========================================================================
   EQUATION STATUS
======================================================================== */
function computeCellStatus() {
  var status = {};
  if (!state.data) return status;
  var p = state.data;
  for (var ei = 0; ei < p.layout.equations.length; ei++) {
    var eq = p.layout.equations[ei];
    if (!eq.cells || eq.cells.length === 0) continue; // removed in arcade mode
    var ops = p.puzzle.eqOps[ei];
    var vals = []; var allFilled = true;
    for (var ci = 0; ci < eq.cells.length; ci++) {
      var v = cellValue(eq.cells[ci]);
      if (v == null) { allFilled = false; break; }
      vals.push(v);
    }
    if (!allFilled) continue;
    var ok = applyChain(vals.slice(0, vals.length - 1), ops) === vals[vals.length - 1];
    var ns = ok ? 'correct' : 'wrong';
    for (var ci2 = 0; ci2 < eq.cells.length; ci2++) {
      var k = eq.cells[ci2];
      if (status[k] === 'wrong') continue;
      if (ns === 'wrong' || !status[k]) status[k] = ns;
    }
  }
  return status;
}

/* Cells related to the currently-selected one (in same equations) */
function relatedCells() {
  var rel = {};
  if (!state.selected || !state.data) return rel;
  var sel = state.selected;
  for (var ei = 0; ei < state.data.layout.equations.length; ei++) {
    var eq = state.data.layout.equations[ei];
    if (eq.cells.indexOf(sel) === -1) continue;
    for (var ci = 0; ci < eq.cells.length; ci++) {
      if (eq.cells[ci] !== sel) rel[eq.cells[ci]] = true;
    }
  }
  return rel;
}

/* ========================================================================
   RENDERING
======================================================================== */
var app = document.getElementById('app');
function el(tag, attrs) {
  var e = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'style') {
        for (var sk in v) if (Object.prototype.hasOwnProperty.call(v, sk)) {
          if (sk.indexOf('--') === 0) e.style.setProperty(sk, v[sk]);
          else e.style[sk] = v[sk];
        }
      }
      else if (k === 'data') {
        for (var dk in v) e.setAttribute('data-' + dk, v[dk]);
      }
      else if (k === 'on') {
        for (var ek in v) e.addEventListener(ek, v[ek]);
      }
      else e.setAttribute(k, v);
    }
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) {
      for (var j = 0; j < c.length; j++) {
        var cc = c[j];
        if (cc == null || cc === false) continue;
        e.appendChild(typeof cc === 'string' || typeof cc === 'number' ? document.createTextNode(String(cc)) : cc);
      }
    } else {
      e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    }
  }
  return e;
}

function render() {
  // Remove any stale overlays/modals from a prior render
  var stale = document.querySelectorAll('.modal-overlay, .solved-overlay');
  for (var si = 0; si < stale.length; si++) {
    if (stale[si].parentNode) stale[si].parentNode.removeChild(stale[si]);
  }
  app.innerHTML = '';
  app.appendChild(renderTopBar());
  app.appendChild(renderDiff());
  app.appendChild(renderTitle());
  if (state.generating || !state.data) {
    app.appendChild(el('div', { 'class': 'loading' }, 'Generating puzzle…'));
    return;
  }
  if (state.settings.scoreMode) app.appendChild(renderScoreBar());
  app.appendChild(renderGrid());
  app.appendChild(renderBank());
  app.appendChild(renderActions());
  app.appendChild(renderBuildFooter());
  if (state.showSolved) renderSolvedOverlay();
  if (state.showStats) renderStatsModal();
  if (state.showSettings) renderSettingsModal();
  // Pop animation only fires on the render immediately after a placement.
  // Clear so subsequent renders don't re-trigger it.
  state.lastFilledKey = null;
  // Same for arcade-incoming cells — clear after the slide-in animation has played.
  // We clear immediately after this render is committed to the DOM; the CSS animation
  // is `forwards`-filled so it stays at its end state visually.
  if (state.arcadeIncomingCells && Object.keys(state.arcadeIncomingCells).length > 0) {
    setTimeout(function () { state.arcadeIncomingCells = {}; }, 600);
  }
}

function renderScoreBar() {
  var bar = el('div', { 'class': 'score-bar' });
  bar.appendChild(el('div', { 'class': 'score-label' }, 'SCORE'));
  bar.appendChild(el('div', { 'class': 'score-display' },
    state.score.toLocaleString()
  ));
  bar.appendChild(el('div', { style: { flex: '1' } }));
  if (state.settings.arcadeMode) {
    bar.appendChild(el('div', { 'class': 'score-label' }, 'CLEARS'));
    bar.appendChild(el('div', { 'class': 'score-display', style: { minWidth: 'auto', color: 'var(--accent-gold)' } },
      String(state.arcadeEqsSolved || 0)
    ));
  }
  if (state.multiplier > 1 && Date.now() < state.comboExpiry) {
    bar.appendChild(el('div', { 'class': 'multiplier-badge' }, '×' + state.multiplier));
    var remaining = Math.max(0, state.comboExpiry - Date.now()) / 5000;
    var fill = el('div', { 'class': 'combo-bar' });
    fill.appendChild(el('div', {
      'class': 'combo-bar-fill',
      style: { width: (remaining * 100) + '%' }
    }));
    bar.appendChild(fill);
  }
  return bar;
}

function renderTopBar() {
  var bar = el('div', { 'class': 'top-bar' });
  var left = el('div', { 'class': 'top-bar-side' });
  left.appendChild(el('button', {
    'class': 'icon-btn', title: 'Undo',
    disabled: state.history.length === 0 ? '' : null,
    on: { click: undo }
  }, '↶'));
  bar.appendChild(left);
  var center = el('div', { 'class': 'top-bar-side', style: { justifyContent: 'center' } });
  center.appendChild(el('div', { 'class': 'timer-display', id: 'timer-display' }, formatTime(state.elapsed)));
  bar.appendChild(center);
  var right = el('div', { 'class': 'top-bar-side right' });
  right.appendChild(el('button', { 'class': 'icon-btn', title: 'Stats', on: { click: function () { state.showStats = true; render(); } } }, '📊'));
  right.appendChild(el('button', { 'class': 'icon-btn', title: 'Settings', on: { click: function () { state.showSettings = true; render(); } } }, '⚙'));
  bar.appendChild(right);

}

function renderDiff() {
  var row = el('div', { 'class': 'diff-row' });
  var keys = ['easy','medium','hard'];
  for (var i = 0; i < keys.length; i++) {
    (function(key) {
      var cfg = DIFFICULTY[key];
      var active = state.difficulty === key && !state.isDaily;
      row.appendChild(el('button', {
        'class': 'diff-pill',
        style: {
          color: active ? 'var(--bg-grid)' : cfg.color,
          background: active ? cfg.color : 'transparent',
          borderColor: cfg.color,
          boxShadow: active ? '0 3px 0 ' + cfg.color + '55' : 'none'
        },
        on: { click: function () { startPuzzle(key, false); } }
      }, cfg.label));
    })(keys[i]);
  }
  // Daily pill
  row.appendChild(el('button', {
    'class': 'daily-pill' + (state.isDaily ? ' active' : ''),
    on: { click: function () { startPuzzle(state.difficulty, true); } }
  }, '✦ Daily'));
  return row;
}
function renderTitle() {
  var streak = state.stats.streak || 0;
  return el('div', { 'class': 'title-area' },
    el('h1', { 'class': 'title' }, 'Crossmath'),
    el('div', {
      'class': 'subtitle',
      style: { color: DIFFICULTY[state.difficulty].color },
      on: { click: function () { state.showStats = true; render(); } }
    },
      (state.isDaily ? 'Daily ' : '') + DIFFICULTY[state.difficulty].label + ' · ' + (state.stats[state.difficulty].solved || 0) + ' solved',
      streak > 0 ? el('span', { 'class': 'streak-badge' }, '🔥 ' + streak) : null
    )
  );
}

function renderGrid() {
  var v = state.visual;
  var solved = isSolved();
  var cellStatus = computeCellStatus();
  var related = relatedCells();

  var vw = window.innerWidth || 380;
  var vh = window.innerHeight || 700;
  var availW = vw - 12;
  // Score bar adds ~36px when in score mode
  var scoreBarReserve = state.settings.scoreMode ? 40 : 0;
  // Bank reserves ~44px per row of tiles. With ~9 tiles per row on phone width.
  var bankUniqueCount = 0;
  if (state.bank) {
    var seenBank = {};
    for (var bi = 0; bi < state.bank.length; bi++) {
      if (!seenBank[state.bank[bi]]) { seenBank[state.bank[bi]] = true; bankUniqueCount++; }
    }
  }
  var bankRows = Math.max(1, Math.ceil(bankUniqueCount / 9));
  var bankReserve = 44 * bankRows + 12; // +padding
  var baseReserve = 190; // top bar + diff pills + title + actions + footer
  var availH = vh - baseReserve - scoreBarReserve - bankReserve;
  if (availH < 140) availH = 140;
  var cellByW = Math.floor(availW / v.cols);
  var cellByH = Math.floor(availH / v.rows);
  // Aim for 44px max. Floor at 22px (small but visible — better than overflow which clips cells).
  var cellSize = Math.min(44, cellByW, cellByH);
  if (cellSize < 22) cellSize = 22;
  var fontMain = Math.max(11, Math.round(cellSize * 0.50));
  var fontOp   = Math.max(13, Math.round(cellSize * 0.55));

  var grid = el('div', {
    'class': 'grid',
    style: {
      gridTemplateColumns: 'repeat(' + v.cols + ', ' + cellSize + 'px)',
      gridTemplateRows:    'repeat(' + v.rows + ', ' + cellSize + 'px)',
      '--cell-size': cellSize + 'px',
      '--font-main': fontMain + 'px',
      '--font-op':   fontOp + 'px'
    }
  });
  for (var key in v.cells) {
    var spec = v.cells[key];
    var p = key.split(',');
    var vr = +p[0], vc = +p[1];
    var cellEl;
    if (spec.type === 'num') cellEl = renderNumCell(spec.cellKey, solved, cellStatus[spec.cellKey], related);
    else if (spec.type === 'op') {
      var opCls = 'cell op';
      if (spec.symbol === '−' || spec.symbol === '÷') opCls += ' minus';
      else if (spec.symbol === '×') opCls += ' multiply';
      cellEl = el('div', { 'class': opCls }, spec.symbol);
    }
    else cellEl = el('div', { 'class': 'cell eq' }, '=');
    cellEl.style.gridRow = (vr + 1).toString();
    cellEl.style.gridColumn = (vc + 1).toString();
    grid.appendChild(cellEl);
  }
  var wrap = el('div', { 'class': 'grid-wrap' + (state.shake ? ' shaking' : '') }, grid);
  return wrap;
}

function renderNumCell(cellKey, solved, eqStatus, related) {
  var isGiven = !!state.data.givens[cellKey];
  var isSettled = !!state.settledCells[cellKey];
  var v = cellValue(cellKey);
  var isFilled = !isGiven && v != null;
  var cls = 'cell num';
  if (isGiven) cls += ' given';
  else if (v != null) cls += ' filled';
  else cls += ' empty';
  if (isSettled) cls += ' settled';
  if (solved) cls += ' solved';
  else if (!isSettled && eqStatus === 'correct') cls += ' eq-correct';
  else if (eqStatus === 'wrong') cls += ' eq-wrong';
  if (related && related[cellKey] && !solved && !isSettled) cls += ' related';
  if (state.selected === cellKey && !solved && !isGiven && !isSettled) cls += ' selected';
  if (isFilled && state.lastFilledKey === cellKey) cls += ' pop';
  var incoming = state.arcadeIncomingCells && state.arcadeIncomingCells[cellKey];
  if (incoming) cls += ' arcade-incoming';
  var data = { 'cell-key': cellKey };
  if (isGiven) data.given = '1';
  if (v != null) data.value = String(v);
  var styleObj = null;
  if (incoming) {
    styleObj = { '--slide-from-x': incoming.fromX, '--slide-from-y': incoming.fromY };
  }
  var attrs = { 'class': cls, data: data };
  if (styleObj) attrs.style = styleObj;
  return el('div', attrs, v == null ? '' : String(v));
}

function renderBank() {
  var wrap = el('div', { 'class': 'bank-wrap' });
  // Consolidate by value: count remaining of each value in the bank vs. what's placed
  var counts = {};        // value -> total in bank
  var firstIdx = {};      // value -> first index seen (for stable sort)
  for (var i = 0; i < state.bank.length; i++) {
    var n = state.bank[i];
    counts[n] = (counts[n] || 0) + 1;
    if (firstIdx[n] === undefined) firstIdx[n] = i;
  }
  var placedCounts = {};
  for (var pk in state.placed) {
    var pv = state.placed[pk];
    placedCounts[pv] = (placedCounts[pv] || 0) + 1;
  }
  var unique = Object.keys(counts).sort(function(a,b) { return (+a) - (+b); });

  // Hint highlight: only the value matching state.hintNumber
  var hintVal = null;
  if (state.hintNumber != null) {
    var alreadyPlaced = state.hintCellKey != null && state.placed[state.hintCellKey] === state.hintNumber;
    if (!alreadyPlaced) hintVal = state.hintNumber;
  }

  for (var ui = 0; ui < unique.length; ui++) {
    var num = +unique[ui];
    var total = counts[num];
    var placed = placedCounts[num] || 0;
    var remaining = total - placed;
    var exhausted = remaining <= 0;
    var cls = 'bank-tile';
    if (exhausted) cls += ' exhausted';
    if (num === hintVal && !exhausted) cls += ' hint-highlight';
    var children = [String(num)];
    if (total > 1) children.push(el('span', { 'class': 'count-badge' }, '×' + remaining));
    wrap.appendChild(el('div', {
      'class': cls,
      data: { num: String(num) }
    }, children));
  }
  return wrap;
}

function detectStuckState() {
  // Returns true if there's any non-given empty cell whose required value isn't available in the bank.
  if (!state.data) return false;
  var p = state.data;
  var bankCounts = {};
  for (var bi = 0; bi < state.bank.length; bi++) bankCounts[state.bank[bi]] = (bankCounts[state.bank[bi]] || 0) + 1;
  var placedCounts = {};
  for (var pk in state.placed) placedCounts[state.placed[pk]] = (placedCounts[state.placed[pk]] || 0) + 1;
  for (var ci = 0; ci < p.layout.cells.length; ci++) {
    var k = p.layout.cells[ci];
    if (p.givens[k] || st_settled(k) || state.placed[k] != null) continue;
    var need = p.puzzle.values[k];
    if ((bankCounts[need] || 0) - (placedCounts[need] || 0) <= 0) return true;
  }
  return false;
}
function st_settled(k) { return !!state.settledCells[k]; }

function fixBank() {
  // Last-resort recovery: clear any wrong placements, then reset bank to what the puzzle needs.
  var p = state.data;
  // Drop any placement whose value doesn't match puzzle.values
  for (var pk in state.placed) {
    if (state.placed[pk] !== p.puzzle.values[pk]) delete state.placed[pk];
  }
  // Rebuild bank from scratch: one tile per non-given cell + decoys
  var bank = [];
  for (var ci = 0; ci < p.layout.cells.length; ci++) {
    var k = p.layout.cells[ci];
    if (!p.givens[k]) bank.push(p.puzzle.values[k]);
  }
  if (p.decoys) for (var di = 0; di < p.decoys.length; di++) bank.push(p.decoys[di]);
  bank.sort(function(a,b){return a-b;});
  state.bank = bank;
  state.lastFilledKey = null;
  render();
}

function copyDebugInfo() {
  var p = state.data;

  var info = {
    build: (document.querySelector('meta[name="build"]') || {getAttribute: function(){return 'unknown';}}).getAttribute('content'),
    difficulty: state.difficulty,
    settings: state.settings,
    layout: { cells: p.layout.cells, equations: p.layout.equations },
    puzzleValues: p.puzzle.values,

    givens: p.givens,
    decoys: p.decoys,
    bank: state.bank,
    placed: state.placed,
    settledCells: state.settledCells,
    clearedEqs: state.clearedEqs
  };
  var text = JSON.stringify(info, null, 2);
  // Try to copy
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');

    }
  } catch (e) {}
  alert('Debug info copied to clipboard. Paste it in chat to send to Claude.');
}

function launchFireworks() {
  if (document.querySelector('.fireworks')) return;
  var container = document.createElement('div');
  container.className = 'fireworks';
  document.body.appendChild(container);
  var BURST_COUNT = 14, SPARKS_PER_BURST = 44, SHOW_DURATION = 5500;
  var vw = window.innerWidth || 380, vh = window.innerHeight || 700;
  var BASE_RADIUS = Math.min(vw, vh) * 0.32;
  for (var b = 0; b < BURST_COUNT; b++) {
    (function (i) {
      var delay = (i * 280 + Math.random() * 180);
      var bx = 50 + Math.random() * (vw - 100);
      var by = 60 + Math.random() * (vh * 0.55);
      var color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
      var launchFrom = vh - by;
      var fw = document.createElement('div');
      fw.className = 'firework';
      fw.style.setProperty('--burst-x', bx + 'px');
      fw.style.setProperty('--burst-y', by + 'px');
      fw.style.setProperty('--burst-color', color);
      fw.style.setProperty('--launch-from', launchFrom + 'px');
      fw.style.animationDelay = (delay / 1000) + 's';
      var rocket = document.createElement('div');
      rocket.className = 'rocket';
      rocket.style.animationDelay = (delay / 1000) + 's';
      fw.appendChild(rocket);
      var flash = document.createElement('div');
      flash.className = 'flash';
      flash.style.animationDelay = ((delay + 600) / 1000) + 's';
      fw.appendChild(flash);
      for (var s = 0; s < SPARKS_PER_BURST; s++) {
        var ang = (s / SPARKS_PER_BURST) * Math.PI * 2 + Math.random() * 0.25;
        var radius = BASE_RADIUS * (0.7 + Math.random() * 0.6);
        var spark = document.createElement('div');
        spark.className = 'spark';
        spark.style.setProperty('--sx', (Math.cos(ang) * radius) + 'px');
        spark.style.setProperty('--sy', (Math.sin(ang) * radius) + 'px');
        spark.style.setProperty('--burst-color', Math.random() < 0.3 ? '#ffffff' : color);
        spark.style.animationDelay = ((delay + 600 + Math.random() * 60) / 1000) + 's';
        fw.appendChild(spark);
      }
      container.appendChild(fw);
    })(b);
  }
  setTimeout(function () { if (container.parentNode) container.parentNode.removeChild(container); }, SHOW_DURATION);
}

/* ========================================================================
   DRAG AND TAP — touch + mouse, with hold delay
======================================================================== */
var dragState = null;
var pendingPress = null;
var pressDownTime = 0;

function findInteractiveTarget(target) {
  if (!target || !target.closest) return null;
  var bankTile = target.closest('.bank-tile');
  if (bankTile && !bankTile.classList.contains('exhausted')) {
    return { kind: 'bank', num: +bankTile.getAttribute('data-num') };
  }
  var cellEl = target.closest('[data-cell-key]');
  if (cellEl && !cellEl.getAttribute('data-given') && !cellEl.classList.contains('settled')) {
    var v = cellEl.getAttribute('data-value');
    return { kind: 'cell', key: cellEl.getAttribute('data-cell-key'), num: v ? +v : null };
  }
  return null;
}
function startDrag(num, source, sourceKey, x, y) {
  dragState = { num: num, source: source, sourceKey: sourceKey };
  var ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  ghost.textContent = String(num);
  document.body.appendChild(ghost);
  dragState.ghost = ghost;
  updateGhost(x, y);
  if (source === 'cell') {
    var ce = document.querySelector('[data-cell-key="' + sourceKey + '"]');
    if (ce) ce.classList.add('dragging-from');
  }
}
function findNearestDroppableCell(x, y) {
  // Strict: try the exact element under the pointer first.
  var target = document.elementFromPoint(x, y);
  var cellEl = (target && target.closest) ? target.closest('[data-cell-key]') : null;
  if (cellEl && !cellEl.getAttribute('data-given') && !cellEl.classList.contains('settled')) {
    return cellEl;
  }
  // Forgiving: find the closest empty/draggable cell whose center is within tolerance.
  // Tolerance: 60% of the cell size beyond the cell's bounding rect.
  var allCells = document.querySelectorAll('[data-cell-key]');
  var bestEl = null;
  var bestDist = Infinity;
  var maxToleranceFraction = 0.6;
  for (var i = 0; i < allCells.length; i++) {
    var el = allCells[i];
    if (el.getAttribute('data-given')) continue;
    if (el.classList.contains('settled')) continue;
    var rect = el.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) continue;
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    // Distance from point to cell center
    var dx = x - cx, dy = y - cy;
    var d = Math.sqrt(dx*dx + dy*dy);
    // Tolerance: cell radius + 60% of cell size
    var maxRadius = (Math.max(rect.width, rect.height) / 2) + (rect.width * maxToleranceFraction);
    if (d > maxRadius) continue;
    if (d < bestDist) { bestDist = d; bestEl = el; }
  }
  return bestEl;
}

function updateGhost(x, y) {
  if (!dragState) return;
  dragState.ghost.style.left = x + 'px';
  dragState.ghost.style.top = y + 'px';
  var existing = document.querySelectorAll('.cell.drop-target');
  for (var i = 0; i < existing.length; i++) existing[i].classList.remove('drop-target');
  var cellEl = findNearestDroppableCell(x, y);
  // Only highlight if the target cell is actually empty (not yet filled).
  // For drag from another cell, swapping into a filled cell is also valid — show as drop target.
  if (cellEl && !cellEl.getAttribute('data-given') && !cellEl.classList.contains('settled')) {
    var hasValue = !!cellEl.getAttribute('data-value');
    if (!hasValue || (dragState && dragState.source === 'cell' && cellEl.getAttribute('data-cell-key') !== dragState.sourceKey)) {
      cellEl.classList.add('drop-target');
    }
  }
}

function endDrag(x, y) {
  if (!dragState) return;
  var cellEl = findNearestDroppableCell(x, y);
  var changed = false;
  if (cellEl && !cellEl.getAttribute('data-given') && !cellEl.classList.contains('settled')) {
    var idx = cellEl.getAttribute('data-cell-key');
    var tv = cellValue(idx);
    if (tv == null) {
      // Reject duplicate from-bank drag if all copies already placed
      if (dragState.source === 'bank') {
        var num = dragState.num;
        var totalInBank = 0;
        for (var bi = 0; bi < state.bank.length; bi++) if (state.bank[bi] === num) totalInBank++;
        var alreadyPlaced = 0;
        for (var pk in state.placed) if (state.placed[pk] === num) alreadyPlaced++;
        if (alreadyPlaced >= totalInBank) {
          if (dragState.ghost) dragState.ghost.remove();
          dragState = null;
          var marks0 = document.querySelectorAll('.dragging-from, .drop-target');
          for (var m0 = 0; m0 < marks0.length; m0++) { marks0[m0].classList.remove('dragging-from'); marks0[m0].classList.remove('drop-target'); }
          return;
        }
      }
      pushHistory();
      if (dragState.source === 'cell') delete state.placed[dragState.sourceKey];
      state.placed[idx] = dragState.num;
      state.lastFilledKey = idx;
      state.selected = null;
      soundClick();
      changed = true;
    } else if (dragState.source === 'cell' && idx !== dragState.sourceKey && !state.data.givens[idx]) {
      pushHistory();
      var other = state.placed[idx];
      state.placed[idx] = dragState.num;
      state.placed[dragState.sourceKey] = other;
      state.lastFilledKey = idx;
      soundClick();
      changed = true;
    }
  } else if (dragState.source === 'cell') {
    pushHistory();
    delete state.placed[dragState.sourceKey];
    state.selected = dragState.sourceKey;
    changed = true;
  }
  if (dragState.ghost) dragState.ghost.remove();
  var lastFilled = state.lastFilledKey;
  dragState = null;
  var marks = document.querySelectorAll('.dragging-from, .drop-target');
  for (var m = 0; m < marks.length; m++) { marks[m].classList.remove('dragging-from'); marks[m].classList.remove('drop-target'); }
  if (changed) {
    render();
    if (lastFilled) detectEquationClears(lastFilled);
    checkAndCelebrate();
  }
}
function cancelDrag() {
  if (dragState && dragState.ghost) dragState.ghost.remove();
  dragState = null;
  var marks = document.querySelectorAll('.dragging-from, .drop-target');
  for (var m = 0; m < marks.length; m++) { marks[m].classList.remove('dragging-from'); marks[m].classList.remove('drop-target'); }
}

function onPressDown(x, y, target) {
  if (state.generating || !state.data || isSolved()) return false;
  var info = findInteractiveTarget(target);
  if (!info) return false;
  pendingPress = { x: x, y: y, info: info };
  pressDownTime = Date.now();
  return true;
}
function onPressMove(x, y) {
  if (dragState) {
    updateGhost(x, y);
    return true;
  }
  if (pendingPress && pendingPress.info.num != null) {
    var dx = x - pendingPress.x, dy = y - pendingPress.y;
    var moved = Math.sqrt(dx*dx + dy*dy);
    // Bank tiles: if movement is dominantly horizontal before drag activates,
    // assume user is scrolling the bank — bail out so the browser handles scroll.
    if (pendingPress.info.kind === 'bank' && moved > DRAG_THRESHOLD
        && Math.abs(dx) > Math.abs(dy) * 1.5
        && Date.now() - pressDownTime < TAP_HOLD_MS) {
      pendingPress = null;
      return false;
    }
    if (moved > DRAG_THRESHOLD && Date.now() - pressDownTime >= TAP_HOLD_MS) {
      var src = pendingPress.info.kind === 'bank' ? 'bank' : 'cell';
      var srcKey = pendingPress.info.kind === 'cell' ? pendingPress.info.key : null;
      startDrag(pendingPress.info.num, src, srcKey, x, y);
      return true;
    }
  }
  return false;
}
function onPressUp(x, y) {
  if (dragState) { endDrag(x, y); pendingPress = null; return true; }
  if (pendingPress) {
    if (pendingPress.info.kind === 'bank') handleBankTap(pendingPress.info.num);
    else if (pendingPress.info.kind === 'cell') handleCellTap(pendingPress.info.key);
  }
  pendingPress = null;
  return false;
}

document.addEventListener('touchstart', function (e) {
  if (e.touches.length !== 1) return;
  var t = e.touches[0];
  var captured = onPressDown(t.clientX, t.clientY, t.target);
  // Only preventDefault for cell taps (which can't scroll) — bank tiles need
  // to let the bank's horizontal scroll work until user actually drags.
  if (captured && pendingPress && pendingPress.info.kind === 'cell') e.preventDefault();
}, { passive: false });
document.addEventListener('touchmove', function (e) {
  if (e.touches.length !== 1) return;
  var t = e.touches[0];
  if (onPressMove(t.clientX, t.clientY)) e.preventDefault();
}, { passive: false });
document.addEventListener('touchend', function (e) {
  if (e.changedTouches.length === 0) return;
  var t = e.changedTouches[0];
  if (onPressUp(t.clientX, t.clientY)) e.preventDefault();
}, { passive: false });
document.addEventListener('touchcancel', function () { cancelDrag(); pendingPress = null; });
document.addEventListener('mousedown', function (e) { if (e.button !== 0) return; onPressDown(e.clientX, e.clientY, e.target); });
document.addEventListener('mousemove', function (e) { onPressMove(e.clientX, e.clientY); });
document.addEventListener('mouseup',   function (e) { onPressUp(e.clientX, e.clientY); });
window.addEventListener('resize', function () { if (state.data) render(); });
window.addEventListener('beforeunload', function () { stopTimer(); });

/* Service Worker — inline via blob URL, caches the page so it works fully offline
   even after first load. Falls back gracefully on browsers without SW support
   or contexts that disallow it (e.g., file:// schemes). */
function registerOfflineServiceWorker() {
  if (!('serviceWorker' in navigator)) return;

                 "self.addEventListener('activate', function(e){e.waitUntil(self.clients.claim());});" +
                 "self.addEventListener('fetch', function(e){" +
                 "  if (e.request.method !== 'GET') return;" +
                 "  e.respondWith(caches.open('crossmath-v44').then(function(cache){" +
                 "    return cache.match(e.request).then(function(hit){" +
                 "      var fetchPromise = fetch(e.request).then(function(resp){" +
                 "        if (resp && resp.status === 200) cache.put(e.request, resp.clone());" +
                 "        return resp;" +
                 "      }).catch(function(){return hit;});" +
                 "      return hit || fetchPromise;" +
                 "    });" +
                 "  }));" +

    var blob = new Blob([swCode], { type: 'application/javascript' });
    var url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(function(){});
  } catch (e) {}
}

loadStats();
applyTheme();
startPuzzle('easy', false);
registerOfflineServiceWorker();
