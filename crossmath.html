<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg-page: #eef2f7;
  --bg-grid: #FBF6E8;
  --cell-empty: #fffdf3;
  --cell-filled: #ffffff;
  --cell-given: #f3deaa;
  --cell-given-text: #2e2410;
  --ink: #1a2332;
  --ink-soft: #57636f;
  --accent-red: #c1432d;
  --accent-green: #6a8e3d;
  --accent-gold: #c89849;
  --eq-correct-bg: #d6e8b4;
  --eq-correct-text: #2d4710;
  --eq-correct-border: #6a8e3d;
  --eq-wrong-bg: #f7caca;
  --eq-wrong-text: #7a1f1f;
  --eq-wrong-border: #c1432d;
  --bank-bg: rgba(80,60,20,0.06);
  --bank-border: rgba(120,90,30,0.2);
  --hint-bg: #fff3c4;
  --hint-border: #c89849;
  --hint-text: #5a3f11;
  --eq-related: rgba(58, 130, 200, 0.18);
  --eq-related-border: rgba(58, 130, 200, 0.55);
}
html.dark {
  --bg-page: #14181f;
  --bg-grid: #1f242b;
  --cell-empty: #2a2f37;
  --cell-filled: #3a4049;
  --cell-given: #4a3f1d;
  --cell-given-text: #e9d3a3;
  --ink: #e8ecf2;
  --ink-soft: #98a3b0;
  --accent-red: #ff6b56;
  --accent-green: #95c662;
  --accent-gold: #e0b566;
  --eq-correct-bg: #2c4520;
  --eq-correct-text: #c4e69a;
  --eq-correct-border: #6a8e3d;
  --eq-wrong-bg: #5b1f1f;
  --eq-wrong-text: #ffcccc;
  --eq-wrong-border: #c1432d;
  --bank-bg: rgba(255,235,180,0.05);
  --bank-border: rgba(200,180,120,0.15);
  --hint-bg: #4a3a14;
  --hint-border: #c89849;
  --hint-text: #ffe4a8;
  --eq-related: rgba(102, 178, 240, 0.20);
  --eq-related-border: rgba(102, 178, 240, 0.55);
}
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100vh; height: 100dvh;
  overflow: hidden; overscroll-behavior: none;
  background: var(--bg-page);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--ink);
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
  transition: background 0.3s, color 0.3s;
}
#app {
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: 6px 6px 8px;
  overflow: hidden;
}

/* Top bar */
.top-bar {
  width: 100%; max-width: 480px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4px 4px; gap: 8px;
  flex-shrink: 0;
}
.top-bar-side { display: flex; gap: 6px; align-items: center; flex: 1; }
.top-bar-side.right { justify-content: flex-end; }
.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1.5px solid var(--ink-soft); color: var(--ink-soft);
  border-radius: 50%; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 700;
  transition: transform 0.15s, color 0.15s, border-color 0.15s;
  padding: 0;
}
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.icon-btn:not(:disabled):hover { transform: scale(1.1); color: var(--ink); border-color: var(--ink); }
.icon-btn:not(:disabled):active { transform: scale(0.92); }
.timer-display {
  font-family: Georgia, serif;
  font-size: 14px; font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
  min-width: 50px; text-align: center;
  font-variant-numeric: tabular-nums;
}

/* Difficulty pills */
.diff-row { display: flex; gap: 4px; margin-bottom: 4px; flex-shrink: 0; }
.diff-pill {
  padding: 4px 10px; border-radius: 999px;
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  background: transparent; border: 1.5px solid;
  cursor: pointer; font-family: inherit;
  transition: transform 0.15s;
}
.diff-pill:hover { transform: scale(1.05); }
.diff-pill:active { transform: scale(0.95); }
.daily-pill {
  padding: 4px 10px; border-radius: 999px;
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  background: transparent; cursor: pointer; font-family: inherit;
  border: 1.5px solid var(--accent-gold); color: var(--accent-gold);
  transition: transform 0.15s;
}
.daily-pill.active {
  background: var(--accent-gold); color: var(--bg-grid);
  box-shadow: 0 3px 0 rgba(200,152,73,0.4);
}
.daily-pill:hover { transform: scale(1.05); }

/* Title */
.title-area { text-align: center; margin-bottom: 4px; flex-shrink: 0; }
.title {
  font-family: Georgia, "Hoefler Text", serif;
  font-size: 18px; font-weight: 900;
  color: var(--ink); letter-spacing: -0.02em; margin: 0;
}
.subtitle {
  margin-top: 1px;
  font-size: 9px;
  letter-spacing: 0.18em; text-transform: uppercase;
  cursor: pointer;
}
.streak-badge {
  display: inline-block;
  margin-left: 6px;
  font-size: 9px; padding: 1px 6px;
  border-radius: 999px;
  background: var(--accent-gold); color: var(--bg-grid);
  font-weight: 700;
}
.loading {
  font-size: 11px; color: var(--ink-soft);
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 60px 0;
}

/* Grid */
.grid-wrap {
  position: relative; padding: 2px;
  flex: 1 1 auto;
  display: flex; align-items: flex-start; justify-content: center;
  padding-top: 8px;
  min-height: 0; width: 100%;
  overflow: hidden;
}
.grid-wrap.shaking { animation: shake 0.45s ease; }
.grid {
  display: grid; gap: 0;
  transform-origin: center center;
}
.cell {
  display: flex; align-items: center; justify-content: center;
  font-family: Georgia, "Hoefler Text", serif;
  font-weight: 800;
  transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.15s;
}
.cell.num {
  font-size: var(--font-main, 16px);
  border: 1.5px solid var(--ink);
  position: relative;
}
.cell.num.given { background: var(--cell-given); color: var(--cell-given-text); }
.cell.num.empty { background: var(--cell-empty); color: var(--ink); cursor: pointer; touch-action: none; }
.cell.num.filled { background: var(--cell-filled); color: var(--ink); cursor: grab; touch-action: none; }
.cell.num.filled:active { cursor: grabbing; }
.cell.num.selected { box-shadow: inset 0 0 0 2.5px var(--accent-red); z-index: 2; }
.cell.num.related {
  background: var(--eq-related) !important;
  box-shadow: inset 0 0 0 2px var(--eq-related-border);
}
.cell.num.eq-correct {
  background: var(--eq-correct-bg) !important;
  color: var(--eq-correct-text) !important;
  border-color: var(--eq-correct-border) !important;
}
.cell.num.eq-wrong {
  background: var(--eq-wrong-bg) !important;
  color: var(--eq-wrong-text) !important;
  border-color: var(--eq-wrong-border) !important;
}
.cell.num.solved {
  background: var(--eq-correct-bg) !important;
  color: var(--eq-correct-text) !important;
  border-color: var(--eq-correct-border) !important;
}
.cell.num.dragging-from { opacity: 0.25; }
.cell.num.drop-target {
  background: #ffe4dc !important;
  border: 2.5px solid var(--accent-red) !important;
  transform: scale(1.18);
  z-index: 10;
  box-shadow:
    inset 0 0 0 2px var(--accent-red),
    0 0 0 4px rgba(193,67,45,0.25),
    0 4px 14px rgba(193,67,45,0.35);
  animation: drop-pulse 0.6s ease-in-out infinite;
}
@keyframes drop-pulse {
  0%, 100% {
    box-shadow: inset 0 0 0 2px var(--accent-red), 0 0 0 4px rgba(193,67,45,0.25), 0 4px 14px rgba(193,67,45,0.35);
  }
  50% {
    box-shadow: inset 0 0 0 2px var(--accent-red), 0 0 0 8px rgba(193,67,45,0.15), 0 4px 18px rgba(193,67,45,0.5);
  }
}
.cell.num.pop { animation: pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }
.cell.op {
  font-size: var(--font-op, 14px); font-weight: 900; color: var(--ink);
  background: transparent;
}
.cell.op.minus { color: var(--accent-red); }
.cell.op.multiply { color: var(--accent-gold); }
.cell.eq {
  font-size: var(--font-op, 13px); font-weight: 900; color: var(--ink);
  background: transparent;
}

/* Bank — horizontally scrollable, consolidated by value */
.bank-wrap {
  margin-top: 6px; padding: 5px 8px;
  background: var(--bank-bg);
  border: 1.5px solid var(--bank-border);
  border-radius: 12px;
  display: flex; flex-wrap: wrap; gap: 4px;
  width: 100%; max-width: 360px;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.bank-scroll-container {
  position: relative;
  width: 100%;
  max-width: 360px;
  flex-shrink: 0;
  margin-top: 6px;
}
.bank-wrap::-webkit-scrollbar { display: none; }
.bank-tile {
  position: relative;
  min-width: 34px; flex-shrink: 0;
  width: 34px; height: 34px;
  font-family: Georgia, serif;
  font-size: 16px; font-weight: 800;
  color: var(--ink); background: var(--cell-filled);
  border: 2px solid var(--ink); border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 0 var(--ink), 0 4px 8px -2px rgba(0,0,0,0.15);
  cursor: grab; touch-action: none;
  transition: transform 0.15s;
}
.bank-tile:hover { transform: scale(1.1); }
.bank-tile:active { cursor: grabbing; }
.bank-tile.exhausted {
  opacity: 0.22; cursor: default; transform: scale(0.9);
  box-shadow: none; background: var(--cell-given);
  color: var(--ink-soft); border-color: var(--bank-border);
}
.bank-tile .count-badge {
  position: absolute;
  top: -5px; right: -5px;
  background: var(--ink); color: var(--bg-grid);
  font-size: 10px; font-weight: 800;
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--bg-grid);
}
.bank-tile.hint-highlight {
  background: var(--hint-bg);
  border-color: var(--hint-border);
  color: var(--hint-text);
  animation: hint-pulse 1.0s ease-in-out infinite;
}
.bank-tile.reject {
  animation: bank-reject 0.32s ease;
}
.action-btn.reject {
  animation: bank-reject 0.32s ease;
}
@keyframes bank-reject {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(2px); }
}
@keyframes hint-pulse {
  0%, 100% {
    box-shadow: 0 2px 0 var(--hint-border), 0 0 0 0 rgba(200,152,73,0.4), 0 4px 8px -2px rgba(0,0,0,0.15);
    transform: scale(1);
  }
  50% {
    box-shadow: 0 2px 0 var(--hint-border), 0 0 0 8px rgba(200,152,73,0), 0 4px 12px -2px rgba(200,152,73,0.4);
    transform: scale(1.12);
  }
}

/* Drag ghost */
.drag-ghost {
  position: fixed; z-index: 1000; pointer-events: none;
  width: 36px; height: 36px;
  font-family: Georgia, serif;
  font-size: 17px; font-weight: 800; color: var(--ink);
  background: var(--cell-filled); border: 2px solid var(--ink); border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  transform: translate(-50%, -50%) scale(1.1) rotate(-3deg);
  will-change: transform, left, top;
}

/* Actions */
.actions {
  margin-top: 6px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 32px; flex-shrink: 0;
}
.action-row { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; justify-content: center; }
.action-btn {
  padding: 4px 9px; background: transparent; border: none;
  cursor: pointer; font-size: 9px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-soft); font-family: inherit; border-radius: 999px;
  transition: color 0.15s, transform 0.1s;
}
.action-btn:disabled { opacity: 0.4; cursor: default; }
.action-btn:not(:disabled):active { transform: scale(0.93); }
.action-btn.hint { font-weight: 700; }
.action-btn.danger { color: var(--accent-red); font-weight: 700; }

.build-footer {
  margin-top: 4px;
  text-align: center;
  font-size: 8px;
  letter-spacing: 0.15em;
  color: var(--ink-soft);
  opacity: 0.5;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  flex-shrink: 0;
}

/* Solved screen */
.solved-overlay {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(20,24,31,0.45);
  display: flex; align-items: center; justify-content: center;
  animation: fade-in 0.4s ease;
  backdrop-filter: blur(2px);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.trophy-card {
  background: var(--bg-grid); border: 3px solid var(--accent-green);
  border-radius: 18px;
  padding: 22px 28px;
  text-align: center;
  max-width: 320px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  animation: trophy-rise 0.55s cubic-bezier(0.22, 1.4, 0.36, 1) both;
}
@keyframes trophy-rise {
  from { transform: translateY(40px) scale(0.8); opacity: 0; }
  to   { transform: translateY(0) scale(1); opacity: 1; }
}
.trophy-icon { font-size: 56px; line-height: 1; margin-bottom: 6px; }
.trophy-text {
  font-family: Georgia, serif;
  font-size: 26px; font-weight: 800; color: var(--accent-green);
  margin-bottom: 4px;
}
.trophy-stats {
  font-size: 11px; color: var(--ink-soft);
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 14px;
}
.trophy-stats strong { color: var(--ink); font-size: 13px; }
.next-btn {
  padding: 9px 22px;
  font-family: Georgia, serif;
  font-size: 14px; font-weight: 700;
  background: var(--ink); color: var(--bg-grid);
  border: none; border-radius: 999px; cursor: pointer;
  margin-right: 4px;
}
.secondary-btn {
  padding: 9px 18px;
  font-family: inherit;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  background: transparent; color: var(--ink-soft);
  border: 1.5px solid var(--ink-soft);
  border-radius: 999px; cursor: pointer;
}

/* Modals */
.modal-overlay {
  position: fixed; inset: 0; z-index: 8000;
  background: rgba(20,24,31,0.55);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(2px);
  animation: fade-in 0.3s ease;
}
.modal {
  background: var(--bg-grid);
  border: 2px solid var(--ink-soft);
  border-radius: 16px;
  padding: 18px 22px;
  max-width: 360px; width: 100%;
  max-height: 80vh; overflow-y: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}
.modal h2 {
  margin: 0 0 12px;
  font-family: Georgia, serif;
  font-size: 18px; font-weight: 800; color: var(--ink);
}
.modal .row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--bank-border);
}
.modal .row:last-child { border-bottom: none; }
.modal .row .label { color: var(--ink-soft); letter-spacing: 0.05em; }
.modal .row .value { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.modal .close-row {
  margin-top: 14px; text-align: center;
}
.modal .toggle {
  width: 38px; height: 22px;
  background: var(--bank-border); border-radius: 999px;
  position: relative; cursor: pointer;
  transition: background 0.2s;
  border: none; padding: 0;
}
.modal .toggle.on { background: var(--accent-green); }
.modal .toggle::after {
  content: '';
  position: absolute; top: 2px; left: 2px;
  width: 16px; height: 16px;
  background: white; border-radius: 50%;
  transition: transform 0.2s;
}
.modal .toggle.on::after { transform: translateX(16px); }

/* Animations */
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
@keyframes pop {
  0% { transform: scale(0.4); opacity: 0; }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes rise {
  0% { transform: translateY(8px) scale(0.96); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

/* Confetti */
@keyframes confetti {
  0% { transform: translate(0,0) scale(0); opacity: 1; }
  100% { transform: translate(var(--dx),var(--dy)) scale(1); opacity: 0; }
}
.confetti-container {
  position: absolute; inset: 0; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.confetti-dot {
  position: absolute; width: 5px; height: 5px;
  border-radius: 999px;
  animation: confetti 0.9s ease-out forwards;
}

/* Score mode */
.score-bar {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 4px 14px;
  margin: 0 8px 8px;
  flex-shrink: 0;
  font-family: Georgia, serif;
  border-bottom: 1px solid var(--bank-border);
  width: calc(100% - 16px); max-width: 360px;
}
.score-display {
  font-size: 16px; font-weight: 800; color: var(--ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  transition: transform 0.18s, color 0.18s;
  min-width: 60px; text-align: right;
}
.score-display.bump {
  transform: scale(1.25);
  color: var(--accent-green);
}
.score-label {
  font-size: 9px; color: var(--ink-soft);
  letter-spacing: 0.18em; text-transform: uppercase;
}
.multiplier-badge {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-gold);
  color: var(--bg-grid);
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.05em;
  animation: mult-pulse 0.6s ease-in-out infinite;
  font-variant-numeric: tabular-nums;
}
@keyframes mult-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}
.combo-bar {
  width: 60px; height: 4px;
  background: var(--bank-border);
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.combo-bar-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-red));
  border-radius: 999px;
  transition: width 0.1s linear;
}

/* Score popup floating from cleared equation */
.score-pop {
  position: fixed;
  z-index: 5000;
  pointer-events: none;
  font-family: Georgia, serif;
  font-size: 22px; font-weight: 900;
  color: var(--accent-green);
  text-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 12px rgba(106,142,61,0.5);
  animation: score-pop 1.0s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  white-space: nowrap;
}
.score-pop.crossmath { color: var(--accent-gold); font-size: 28px; }
@keyframes score-pop {
  0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
  20%  { transform: translate(-50%, -100%) scale(1.2); opacity: 1; }
  60%  { transform: translate(-50%, -120%) scale(1.0); opacity: 1; }
  100% { transform: translate(-50%, -180%) scale(0.8); opacity: 0; }
}

/* Equation collapse: cells flash bright, then collapse + spin out */
.cell.num.value-locator {
  animation: value-flash 0.7s ease-out;
  z-index: 5;
}
@keyframes value-flash {
  0%, 100% { box-shadow: none; }
  50% { box-shadow: 0 0 0 4px var(--accent-gold), 0 0 12px 4px rgba(200,152,73,0.7); }
}

.cell.num.flashing {
  background: #fff5b8 !important;
  color: #2d4710 !important;
  border-color: var(--accent-green) !important;
  box-shadow:
    inset 0 0 0 3px var(--accent-green),
    0 0 16px 4px rgba(255, 220, 100, 0.7) !important;
  transform: scale(1.12);
  z-index: 5;

<body>
<div id="app"></div>
<script>
(function () {
'use strict';

/* ========================================================================
   CONFIG
======================================================================== */
var DRAG_THRESHOLD = 6;
var TAP_HOLD_MS = 110; // small delay before drag activates — protects taps

var DIFFICULTY = {
  easy:   { label: 'Easy',   color: '#6a8e3d', poolMax: 30, minusChance: 0.30, maxNum: 60,
            numEquations: 8,  givenCount: 11, decoyCount: 3, minChainDepth: 0, maxLayoutDim: 5 },
  medium: { label: 'Medium', color: '#c89849', poolMax: 40, minusChance: 0.55, maxNum: 80,
            numEquations: 10, givenCount: 13, decoyCount: 4, minChainDepth: 2, maxLayoutDim: 6 },
  hard:   { label: 'Hard',   color: '#c1432d', poolMax: 70, minusChance: 0.75, maxNum: 150,
            numEquations: 12, givenCount: 13, decoyCount: 7, minChainDepth: 3, maxLayoutDim: 7 }
};

var FIREWORK_COLORS = [
  '#ff4d4d', '#ffce3a', '#5fe663', '#3ac0ff',
  '#c46bff', '#ff7ad9', '#ffffff', '#ffa53a'

/* ========================================================================
   UTILITIES
======================================================================== */
function shuffle(arr) {
  var a = arr.slice();

// Returns null if the result wouldn't be a positive integer.
// Position 0 = solve for a, given b and c.  Position 1 = solve for b.  Position 2 = solve for c.

  // knownVals has 3 entries; the one at missingPos is undefined.

  var v;
  if (missingPos === 0) {
    if (op === '+') v = c - b;
    else if (op === '−') v = c + b;
    else if (op === '×') { if (b === 0 || c % b !== 0) return null; v = c / b; }
    else if (op === '÷') v = c * b;
    else v = c + b;
  } else if (missingPos === 1) {
    if (op === '+') v = c - a;
    else if (op === '−') v = a - c;
    else if (op === '×') { if (a === 0 || c % a !== 0) return null; v = c / a; }
    else if (op === '÷') { if (c === 0 || a % c !== 0) return null; v = a / c; }
    else v = a - c;
  } else {
    v = applyOp(a, op, b);
  }
  if (!Number.isInteger(v) || v < 1) return null;
  return v;
}
function applyChain(values, ops) {
  var r = values[0];
  for (var i = 0; i < ops.length; i++) r = applyOp(r, ops[i], values[i + 1]);
  return r;
}

/* Seedable RNG for daily puzzles (mulberry32) */
function seedRng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
function dailySeed(diff) {
  var d = new Date();
  var ymd = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  var diffOffset = diff === 'easy' ? 1 : diff === 'medium' ? 2 : 3;
  return ymd * 10 + diffOffset;
}
function todayKey() {
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function yesterdayKey() {
  var d = new Date(); d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}

/* RNG-driven helpers used by the layout/value generators */
var R = Math.random;
function rndInt(max) { return Math.floor(R() * max); }

/* ========================================================================
   LAYOUT GENERATOR — sparse irregular crossword, triplets only
======================================================================== */
function genLayout(cfg) {
  var occupied = {};
  var cellEqs = {};
  var equations = [];

  function placeKeys(orientation, anchorKey, anchorIdx) {
    var p = anchorKey.split(',');
    var r0 = +p[0], c0 = +p[1];
    var keys = [];
    for (var i = 0; i < 3; i++) {
      var off = i - anchorIdx;
      var r, c;
      if (orientation === 'h') { r = r0; c = c0 + off; }
      else { r = r0 + off; c = c0; }
      keys.push(r + ',' + c);
    }
    return keys;
  }

  // Seed at (10, 10), horizontal
  var firstKeys = ['10,10', '10,11', '10,12'];
  for (var i = 0; i < 3; i++) {
    occupied[firstKeys[i]] = true;
    cellEqs[firstKeys[i]] = [0];
  }
  equations.push({ cells: firstKeys, orientation: 'h' });

  while (equations.length < cfg.numEquations) {
    var added = false;
    var attempts = 0;
    while (attempts < 250 && !added) {
      attempts++;
      var lowDegree = [], midDegree = [];
      for (var ck in cellEqs) {
        if (cellEqs[ck].length === 1) lowDegree.push(ck);
        else if (cellEqs[ck].length === 2) midDegree.push(ck);
      }
      var pool;
      if (lowDegree.length > 0 && (midDegree.length === 0 || R() < 0.80)) pool = lowDegree;
      else if (midDegree.length > 0) pool = midDegree;
      else break;

      var anchorKey = pool[rndInt(pool.length)];
      var usedOrients = {};
      for (var aei = 0; aei < cellEqs[anchorKey].length; aei++) {
        usedOrients[equations[cellEqs[anchorKey][aei]].orientation] = true;
      }
      var newOrient;
      if (!usedOrients.h) newOrient = 'h';
      else if (!usedOrients.v) newOrient = 'v';
      else continue;

      var anchorIdx = rndInt(3);
      var keys = placeKeys(newOrient, anchorKey, anchorIdx);

      // Check overlap
      var bad = false;
      for (var ki = 0; ki < keys.length; ki++) {
        if (keys[ki] === anchorKey) continue;
        if (occupied[keys[ki]]) { bad = true; break; }
      }
      if (bad) continue;

      var first = keys[0].split(',');
      var last = keys[keys.length - 1].split(',');
      var headKey, tailKey;
      if (newOrient === 'h') {
        headKey = (+first[0]) + ',' + (+first[1] - 1);
        tailKey = (+last[0]) + ',' + (+last[1] + 1);
      } else {
        headKey = (+first[0] - 1) + ',' + (+first[1]);
        tailKey = (+last[0] + 1) + ',' + (+last[1]);
      }
      if (occupied[headKey] || occupied[tailKey]) continue;

      // Anti-chain: no row or column with 4+ consecutive cells
      var hyp = {};
      for (var ho in occupied) hyp[ho] = true;
      for (var hk = 0; hk < keys.length; hk++) hyp[keys[hk]] = true;
      var chainBad = false;
      for (var hk2 in hyp) {
        if (chainBad) break;
        var pp3 = hk2.split(',');
        var hr = +pp3[0], hc = +pp3[1];
        if (!hyp[hr + ',' + (hc - 1)]) {
          var l = 0, c4 = hc;
          while (hyp[hr + ',' + c4]) { l++; c4++; }
          if (l > 3) { chainBad = true; break; }
        }
        if (!hyp[(hr - 1) + ',' + hc]) {
          var lv = 0, r4 = hr;
          while (hyp[r4 + ',' + hc]) { lv++; r4++; }
          if (lv > 3) { chainBad = true; break; }
        }
      }
      if (chainBad) continue;

      // Compactness cap: reject placements that would expand the layout's bounding box
      // beyond the difficulty's maxLayoutDim. Without this, layouts can sprawl beyond the
      // viewport and force horizontal scrolling.
      var maxDim = cfg.maxLayoutDim || 8;
      // Compute current bounding box from all occupied + new keys
      var minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
      for (var bk in occupied) {
        var bp = bk.split(',');
        var br = +bp[0], bc = +bp[1];
        if (br < minR) minR = br;
        if (br > maxR) maxR = br;
        if (bc < minC) minC = bc;
        if (bc > maxC) maxC = bc;
      }
      for (var nk = 0; nk < keys.length; nk++) {
        var npp = keys[nk].split(',');
        var nr = +npp[0], nc = +npp[1];
        if (nr < minR) minR = nr;
        if (nr > maxR) maxR = nr;
        if (nc < minC) minC = nc;
        if (nc > maxC) maxC = nc;
      }
      var bboxRows = maxR - minR + 1;
      var bboxCols = maxC - minC + 1;
      if (bboxRows > maxDim || bboxCols > maxDim) continue;

      // Commit
      var eqIdx = equations.length;
      for (var kj = 0; kj < keys.length; kj++) {
        occupied[keys[kj]] = true;
        if (!cellEqs[keys[kj]]) cellEqs[keys[kj]] = [];
        cellEqs[keys[kj]].push(eqIdx);
      }
      equations.push({ cells: keys, orientation: newOrient });
      added = true;
    }
    if (!added) break;
  }

  // Normalize coordinates so they start at 0,0
  var minR = Infinity, minC = Infinity;
  for (var key in occupied) {
    var pp = key.split(',');
    if (+pp[0] < minR) minR = +pp[0];
    if (+pp[1] < minC) minC = +pp[1];
  }
  var maxR = 0, maxC = 0;
  for (var ei = 0; ei < equations.length; ei++) {
    var newKeys = [];
    for (var jj = 0; jj < equations[ei].cells.length; jj++) {
      var qq = equations[ei].cells[jj].split(',');
      var nr2 = +qq[0] - minR, nc2 = +qq[1] - minC;
      newKeys.push(nr2 + ',' + nc2);
      if (nr2 > maxR) maxR = nr2;
      if (nc2 > maxC) maxC = nc2;
    }
    equations[ei].cells = newKeys;
  }
  var seen2 = {};
  var cellsList = [];
  for (var ei2 = 0; ei2 < equations.length; ei2++) {
    for (var ck2 = 0; ck2 < equations[ei2].cells.length; ck2++) {
      var key2 = equations[ei2].cells[ck2];
      if (!seen2[key2]) { seen2[key2] = true; cellsList.push(key2); }
    }
  }
  return { equations: equations, cells: cellsList, rows: maxR + 1, cols: maxC + 1 };
}

/* ========================================================================
   VALUE ASSIGNMENT
======================================================================== */
function assignValues(layout, cfg) {
  // Operator pool depends on settings. With muldiv off, only +/−. With muldiv on, all four.
  var allowMulDiv = !!(state && state.settings && state.settings.mulDiv);

  function rnd(maxBound) {
    var m = maxBound || cfg.poolMax;
    return 1 + rndInt(m);
  }
  function pickOp() {
    if (allowMulDiv) {
      // 35% +, 20% −, 22% ×, 23% ÷ — biased toward variety
      var r = R();
      if (r < 0.35) return '+';
      if (r < 0.55) return '−';
      if (r < 0.77) return '×';
      return '÷';

    return R() < cfg.minusChance ? '−' : '+';
  }
  function valid(n) { return Number.isInteger(n) && n >= 1 && n <= cfg.maxNum; }
  function pickValuesForOp(op, existingV0, existingV1, existingV2) {
    // Choose v0, v1, v2 such that v0 op v1 = v2, respecting existing constraints.
    // Returns {v0, v1, v2} or null.
    // Strategy varies by operator to keep all values valid positive integers ≤ maxNum.
    var v0, v1, v2;
    if (op === '+') {
      v0 = existingV0 !== undefined ? existingV0 : rnd();
      v1 = existingV1 !== undefined ? existingV1 : rnd();
      v2 = v0 + v1;
    } else if (op === '−') {
      v0 = existingV0 !== undefined ? existingV0 : rnd();
      v1 = existingV1 !== undefined ? existingV1 : rnd();
      v2 = v0 - v1;
    } else if (op === '×') {
      // Keep product ≤ maxNum: pick v0 ∈ [2, sqrt(maxNum)], v1 ∈ [2, maxNum / v0]
      // Avoid v0=1 or v1=1 (trivial answers).
      var maxFactor = Math.floor(Math.sqrt(cfg.maxNum));
      v0 = existingV0 !== undefined ? existingV0 : (2 + rndInt(Math.max(1, maxFactor - 1)));
      if (v0 < 2 || v0 > cfg.maxNum) return null;
      var maxV1 = Math.floor(cfg.maxNum / Math.max(1, v0));
      if (maxV1 < 2) return null;
      v1 = existingV1 !== undefined ? existingV1 : (2 + rndInt(Math.max(1, maxV1 - 1)));
      if (v1 < 2 || v1 > cfg.maxNum) return null;
      v2 = v0 * v1;
    } else if (op === '÷') {
      // a ÷ b = c, so a = b × c. Pick b ∈ [2, sqrt(maxNum)], c ∈ [2, maxNum / b].
      var maxF2 = Math.floor(Math.sqrt(cfg.maxNum));
      v1 = existingV1 !== undefined ? existingV1 : (2 + rndInt(Math.max(1, maxF2 - 1)));
      if (v1 < 2 || v1 > cfg.maxNum) return null;
      var maxQuot = Math.floor(cfg.maxNum / Math.max(1, v1));
      if (maxQuot < 2) return null;
      v2 = existingV2 !== undefined ? existingV2 : (2 + rndInt(Math.max(1, maxQuot - 1)));
      if (v2 < 2 || v2 > cfg.maxNum) return null;
      v0 = v1 * v2;
    } else return null;
    if (!valid(v0) || !valid(v1) || !valid(v2)) return null;
    if (existingV0 !== undefined && existingV0 !== v0) return null;
    if (existingV1 !== undefined && existingV1 !== v1) return null;
    if (existingV2 !== undefined && existingV2 !== v2) return null;
    return { v0: v0, v1: v1, v2: v2 };
  }

  for (var attempt = 0; attempt < 5000; attempt++) {
    var values = {};
    var eqOps = [];
    var ok = true;
    for (var ei = 0; ei < layout.equations.length; ei++) {
      var eq = layout.equations[ei];
      // Try the preferred operator (from pickOp's distribution) up to 30 times,
      // only falling back to alternative operators if that fails.
      var preferredOp = pickOp();
      var picked = null;
      for (var inner0 = 0; inner0 < 30; inner0++) {
        var got0 = pickValuesForOp(preferredOp, values[eq.cells[0]], values[eq.cells[1]], values[eq.cells[2]]);
        if (got0) { picked = { op: preferredOp, v: got0 }; break; }
      }
      if (!picked) {
        var opTriesAll = allowMulDiv ? ['+', '−', '×', '÷'] : ['+', '−'];
        shuffle(opTriesAll);
        for (var oi = 0; oi < opTriesAll.length; oi++) {
          var tryOp = opTriesAll[oi];
          if (tryOp === preferredOp) continue;
          for (var inner = 0; inner < 30; inner++) {
            var got = pickValuesForOp(tryOp, values[eq.cells[0]], values[eq.cells[1]], values[eq.cells[2]]);
            if (got) { picked = { op: tryOp, v: got }; break; }
          }
          if (picked) break;
        }
      }
      if (!picked) { ok = false; break; }
      values[eq.cells[0]] = picked.v.v0;
      values[eq.cells[1]] = picked.v.v1;
      values[eq.cells[2]] = picked.v.v2;
      eqOps.push([picked.op]);
    }
    if (ok) return { values: values, eqOps: eqOps };
  }
  return null;
}

/* ========================================================================
   SOLVER + DEDUCIBILITY
======================================================================== */
function isDeducible(layout, puzzle, givens) {
  var known = {};
  for (var k in givens) if (givens[k]) known[k] = puzzle.values[k];
  var depth = 0;
  while (true) {
    var progressed = false;
    for (var ei = 0; ei < layout.equations.length; ei++) {
      var eq = layout.equations[ei];
      var c0 = eq.cells[0], c1 = eq.cells[1], c2 = eq.cells[2];
      var ops = puzzle.eqOps[ei];
      var k0 = known[c0], k1 = known[c1], k2 = known[c2];
      var unknown = (k0 === undefined ? 1 : 0) + (k1 === undefined ? 1 : 0) + (k2 === undefined ? 1 : 0);
      if (unknown !== 1) continue;
      var missingPos = (k0 === undefined) ? 0 : (k1 === undefined ? 1 : 2);
      var solved = backCompute(ops[0], [k0, k1, k2], missingPos);
      if (solved == null) continue; // can't deduce a valid positive integer
      known[eq.cells[missingPos]] = solved;
      progressed = true;
    }
    if (!progressed) break;
    depth++;
  }
  for (var i = 0; i < layout.cells.length; i++) {
    if (known[layout.cells[i]] === undefined) return { ok: false, depth: depth };
  }
  return { ok: true, depth: depth };
}

function countSolutions(layout, puzzle, givens, cap, extras) {
  var emptyCells = [];
  for (var i = 0; i < layout.cells.length; i++) {
    if (!givens[layout.cells[i]]) emptyCells.push(layout.cells[i]);
  }
  var bank = [];
  for (var ec = 0; ec < emptyCells.length; ec++) bank.push(puzzle.values[emptyCells[ec]]);
  if (extras) for (var xi = 0; xi < extras.length; xi++) bank.push(extras[xi]);
  var available = bank.slice();
  var assign = {};
  for (var k in givens) if (givens[k]) assign[k] = puzzle.values[k];

  // Order empty cells by participation count (most-constrained first)
  emptyCells.sort(function (a, b) {
    var aEqs = 0, bEqs = 0;
    for (var ee = 0; ee < layout.equations.length; ee++) {
      if (layout.equations[ee].cells.indexOf(a) !== -1) aEqs++;
      if (layout.equations[ee].cells.indexOf(b) !== -1) bEqs++;
    }
    return bEqs - aEqs;
  });

  var count = 0;
  function checkEqsAtCell(key) {
    for (var ei = 0; ei < layout.equations.length; ei++) {
      var eq = layout.equations[ei];
      if (eq.cells.indexOf(key) === -1) continue;
      var c0 = eq.cells[0], c1 = eq.cells[1], c2 = eq.cells[2];
      if (assign[c0] !== undefined && assign[c1] !== undefined && assign[c2] !== undefined) {
        if (applyOp(assign[c0], puzzle.eqOps[ei][0], assign[c1]) !== assign[c2]) return false;
      }
    }
    return true;
  }
  function recurse(idx) {
    if (count >= cap) return;
    if (idx === emptyCells.length) { count++; return; }
    var key = emptyCells[idx];
    var tried = {};
    for (var bi = 0; bi < available.length; bi++) {
      var v = available[bi];
      if (v == null) continue;
      if (tried[v]) continue;
      tried[v] = true;
      assign[key] = v;
      if (checkEqsAtCell(key)) {
        available[bi] = null;
        recurse(idx + 1);
        available[bi] = v;
        if (count >= cap) { delete assign[key]; return; }
      }
    }
    delete assign[key];
  }
  recurse(0);
  return count;
}

/* ========================================================================
   GIVENS PICKER — deduction-solvable, balanced, depth-aware
======================================================================== */
function pickGivens(layout, puzzle, targetCount, cfg) {
  var bestScore = -1;
  var bestGivens = null;
  for (var attempt = 0; attempt < 400; attempt++) {
    var shuffled = shuffle(layout.cells);
    var picked = shuffled.slice(0, targetCount);
    var givens = {};
    for (var p = 0; p < picked.length; p++) givens[picked[p]] = true;
    // Coverage rule: each equation must have 1 or 2 givens (never 0 or 3)
    var bad = false;
    var resultGivenCount = 0;   // equations whose result cell is given
    var backComputeCount = 0;   // equations the player will back-compute (result given but at least one operand missing)
    var forwardComputeCount = 0;// equations the player will forward-compute (both operands given but result missing)
    for (var ei = 0; ei < layout.equations.length; ei++) {
      var eq = layout.equations[ei];
      var g0 = !!givens[eq.cells[0]];
      var g1 = !!givens[eq.cells[1]];
      var g2 = !!givens[eq.cells[2]];
      var g = (g0?1:0)+(g1?1:0)+(g2?1:0);
      if (g === 0 || g === 3) { bad = true; break; }
      if (g2) resultGivenCount++;
      // What's the FIRST kind of step the player would do here? Only relevant if 2-given.
      if (g === 2) {
        if (g0 && g1) forwardComputeCount++;
        else backComputeCount++;
      }
    }
    if (bad) continue;
    // Need at least one back-compute step somewhere — otherwise the puzzle is trivial
    // (just add/subtract, no actual solving for unknowns).
    if (backComputeCount === 0) continue;
    var ded = isDeducible(layout, puzzle, givens);
    if (!ded.ok) continue;
    if (countSolutions(layout, puzzle, givens, 2) !== 1) continue;
    if (ded.depth < cfg.minChainDepth) continue;

    // Score: prefer higher chain depth (more interesting), more back-compute steps,
    // and more result-cells given (more variety).
    var score = ded.depth * 10 + backComputeCount * 3 + resultGivenCount;
    if (score > bestScore) { bestScore = score; bestGivens = givens; }
    // If we found one with at least minChainDepth+1 depth and a healthy back-compute count,
    // good enough — return early to keep generation snappy.
    if (ded.depth >= cfg.minChainDepth + 1 && backComputeCount >= 2) return givens;
  }
  return bestGivens;
}

/* ========================================================================
   SMART DECOY PICKER
======================================================================== */
function pickDecoys(layout, puzzle, givens, count, cfg) {
  if (count <= 0) return [];
  var taken = {};
  for (var i = 0; i < layout.cells.length; i++) taken[puzzle.values[layout.cells[i]]] = true;

  // Generate candidate decoys: prefer values close to real values (more confusing)
  var candidates = [];
  for (var ci = 0; ci < layout.cells.length; ci++) {
    var v = puzzle.values[layout.cells[ci]];
    var offsets = [-3, -2, -1, 1, 2, 3];
    for (var o = 0; o < offsets.length; o++) {
      var c = v + offsets[o];
      if (c >= 1 && c <= cfg.maxNum && !taken[c]) candidates.push(c);
    }
  }
  // Add some random values too for variety
  for (var ri = 0; ri < 20; ri++) {
    var rv = 1 + rndInt(cfg.maxNum);
    if (!taken[rv]) candidates.push(rv);
  }

  for (var attempt = 0; attempt < 200; attempt++) {
    var shuffled = shuffle(candidates);
    var decoys = [];
    var used = {};
    for (var sk = 0; sk < shuffled.length && decoys.length < count; sk++) {
      var d = shuffled[sk];
      if (used[d]) continue;
      decoys.push(d); used[d] = true;
    }
    if (decoys.length < count) continue;
    if (countSolutions(layout, puzzle, givens, 2, decoys) === 1) return decoys;
  }
  return null;
}

/* ========================================================================
   STACKED LAYOUT (arcade Tetris mode)
   Builds a vertical stack of horizontal-equation "layers" connected by
   vertical-equation "connectors". Bottom layer can clear when its
   horizontal equations are all correctly solved; gravity drops everything
   above; a fresh layer spawns at the top.
======================================================================== */
function genArcadeStack(cfg, numLayers) {
  numLayers = numLayers || 4;
  var equations = [];
  var occupied = {};
  var layers = [];

  // Layer 0 (top): one horizontal triplet at row 0, cols 0..2
  var firstCells = ['0,0', '0,1', '0,2'];
  for (var i = 0; i < 3; i++) occupied[firstCells[i]] = true;
  equations.push({ cells: firstCells, orientation: 'h' });
  layers.push({ row: 0, hEqIndices: [0], vEqIndicesUp: [] });

  var prevConnectorCol = null;

  for (var li = 1; li < numLayers; li++) {
    var prevLayer = layers[li - 1];
    var newRow = prevLayer.row + 2;
    var prevHEq = equations[prevLayer.hEqIndices[0]];
    var prevHEqStartCol = +prevHEq.cells[0].split(',')[1];

    var added = false;
    for (var attempt = 0; attempt < 50; attempt++) {
      // Bias toward 0 offset; allow ±1 for irregular look
      var offsetPool = [-1, 0, 0, 0, 1];
      var offset = offsetPool[Math.floor(R() * offsetPool.length)];
      var newHStartCol = prevHEqStartCol + offset;

      // Shared column range with prev layer (anchor must be in both)
      var newHCols = [newHStartCol, newHStartCol + 1, newHStartCol + 2];
      var prevHCols = [prevHEqStartCol, prevHEqStartCol + 1, prevHEqStartCol + 2];
      var sharedCols = [];
      for (var nc = 0; nc < newHCols.length; nc++) {
        if (prevHCols.indexOf(newHCols[nc]) !== -1) sharedCols.push(newHCols[nc]);
      }
      if (sharedCols.length === 0) continue;

      // Connector column must differ from previous to avoid 4+ chain at the same col
      var options = [];
      for (var sc = 0; sc < sharedCols.length; sc++) {
        if (sharedCols[sc] !== prevConnectorCol) options.push(sharedCols[sc]);
      }
      if (options.length === 0) continue;
      var connectorCol = options[Math.floor(R() * options.length)];

      var newHCells = [];
      for (var hi = 0; hi < 3; hi++) newHCells.push(newRow + ',' + newHCols[hi]);
      var connectorCell = (newRow - 1) + ',' + connectorCol;

      var conflict = false;
      for (var ch = 0; ch < newHCells.length; ch++) {
        if (occupied[newHCells[ch]]) { conflict = true; break; }
      }
      if (conflict) continue;
      if (occupied[connectorCell]) continue;

      // Commit
      for (var ch2 = 0; ch2 < newHCells.length; ch2++) occupied[newHCells[ch2]] = true;
      occupied[connectorCell] = true;
      var hEqIdx = equations.length;
      equations.push({ cells: newHCells, orientation: 'h' });
      var vEqCells = [
        (newRow - 2) + ',' + connectorCol,
        connectorCell,
        newRow + ',' + connectorCol
      ];
      var vEqIdx = equations.length;
      equations.push({ cells: vEqCells, orientation: 'v' });
      layers.push({ row: newRow, hEqIndices: [hEqIdx], vEqIndicesUp: [vEqIdx] });
      prevConnectorCol = connectorCol;
      added = true;
      break;
    }
    if (!added) return null;
  }

  // Normalize so leftmost column is 0 (handles BOTH negative and positive minC).
  // Bug pre-v44e: guard was `if (minC > 0)` which left negative-col layouts
  // unnormalized. CSS Grid renders negative grid-column as "from the end",
  // breaking the visual.
  var cells = Object.keys(occupied);
  var minC = Infinity;
  for (var ki = 0; ki < cells.length; ki++) {
    minC = Math.min(minC, +cells[ki].split(',')[1]);
  }
  if (minC !== 0) {
    cells = cells.map(function (k) {
      var p = k.split(','); return (+p[0]) + ',' + ((+p[1]) - minC);
    });
    for (var ei = 0; ei < equations.length; ei++) {
      equations[ei].cells = equations[ei].cells.map(function (k) {
        var p = k.split(','); return (+p[0]) + ',' + ((+p[1]) - minC);
      });
    }
  }

  var maxR = 0, maxC = 0;
  for (var kj = 0; kj < cells.length; kj++) {
    var pp = cells[kj].split(',');
    maxR = Math.max(maxR, +pp[0]);
    maxC = Math.max(maxC, +pp[1]);
  }

  return {
    cells: cells,
    equations: equations,
    rows: maxR + 1,
    cols: maxC + 1,
    layers: layers,
    isStacked: true
  };
}

/* Givens for stacked layouts: each horizontal equation must be solvable
   from its own givens alone — so when a layer collapses, the rest stays
   deducible. Strategy:
     - Mark every cell as given by default
     - For each hEq: un-give exactly one cell (the non-vEq-endpoint cell, if any)
     - Un-give all vEq middle cells (they're filled by deducing from endpoints)
   Result: each hEq has 2 givens (independently solvable), each vEq has 2 givens
   at its endpoints + 1 unknown middle (also independently solvable). */
function pickStackedGivens(layout, puzzle) {
  var givens = {};
  for (var i = 0; i < layout.cells.length; i++) givens[layout.cells[i]] = true;

  // Identify cells that are vEq endpoints — they must stay given so adjacent
  // hEqs aren't dependent on each other through a vEq.
  var vEndpoints = {};
  for (var ei = 0; ei < layout.equations.length; ei++) {
    var eq = layout.equations[ei];
    if (eq.orientation !== 'v' || eq.cells.length !== 3) continue;
    vEndpoints[eq.cells[0]] = true;
    vEndpoints[eq.cells[2]] = true;
  }

  // For each hEq, pick one cell to NOT give (preferring non-vEq-endpoint cells)
  for (var ej = 0; ej < layout.equations.length; ej++) {
    var heq = layout.equations[ej];
    if (heq.orientation !== 'h' || heq.cells.length !== 3) continue;
    var candidates = [];
    for (var c = 0; c < 3; c++) {
      if (!vEndpoints[heq.cells[c]]) candidates.push(c);
    }
    // If all 3 cells are vEq endpoints (rare — only if 2 vEqs from the same hEq),
    // pick any cell as non-given.
    if (candidates.length === 0) candidates = [0, 1, 2];
    var pick = candidates[Math.floor(R() * candidates.length)];
    delete givens[heq.cells[pick]];
  }

  // Un-give all vEq middle cells
  for (var ek = 0; ek < layout.equations.length; ek++) {
    var veq = layout.equations[ek];
    if (veq.orientation !== 'v' || veq.cells.length !== 3) continue;
    delete givens[veq.cells[1]];
  }

  return givens;
}

// At least one hEq has its non-given cell at an operand position (not the result).
function hasBackComputeInStacked(layout, givens) {
  for (var ei = 0; ei < layout.equations.length; ei++) {
    var eq = layout.equations[ei];
    if (eq.orientation !== 'h' || eq.cells.length !== 3) continue;
    var nonGivenIdx = -1;
    for (var c = 0; c < 3; c++) {
      if (!givens[eq.cells[c]]) { nonGivenIdx = c; break; }
    }
    if (nonGivenIdx === 0 || nonGivenIdx === 1) return true; // operand → back-compute
  }
  return false;
}

function generateStackedPuzzle(diff, cfg, numLayers) {
  for (var attempt = 0; attempt < 500; attempt++) {
    var layout = genArcadeStack(cfg, numLayers);
    if (!layout) continue;
    var puzzle = assignValues(layout, cfg);
    if (!puzzle) continue;
    // For Tetris-style independent layer collapse, each hEq must be solvable
    // from its own givens. pickStackedGivens enforces that.
    var givens = pickStackedGivens(layout, puzzle);
    if (!givens) continue;
    // Verify: deducible + uniquely solvable + has at least one back-compute step
    var ded = isDeducible(layout, puzzle, givens);
    if (!ded.ok) continue;
    if (countSolutions(layout, puzzle, givens, 2) !== 1) continue;
    if (!hasBackComputeInStacked(layout, givens)) continue;
    var decoys = pickDecoys(layout, puzzle, givens, cfg.decoyCount || 0, cfg);
    if (!decoys) continue;

    // Bank-supply check
    var needCounts = {}, bankCounts = {};
    for (var sci = 0; sci < layout.cells.length; sci++) {
      var sk = layout.cells[sci];
      if (!givens[sk]) {
        var sv = puzzle.values[sk];
        needCounts[sv] = (needCounts[sv] || 0) + 1;
        bankCounts[sv] = (bankCounts[sv] || 0) + 1;
      }
    }
    for (var sdi = 0; sdi < decoys.length; sdi++) {
      bankCounts[decoys[sdi]] = (bankCounts[decoys[sdi]] || 0) + 1;
    }
    var bankOk = true;
    for (var nv in needCounts) {
      if ((bankCounts[nv] || 0) < needCounts[nv]) { bankOk = false; break; }
    }
    if (!bankOk) continue;

    return {
      layout: layout, puzzle: puzzle, givens: givens, decoys: decoys,
      difficulty: diff, isStacked: true
    };
  }
  return null;
}

/* ========================================================================
   GENERATE PUZZLE
======================================================================== */
// Compute the maximum layout dimension that will fit on the current viewport
// while keeping cells at a comfortable target size. Visual grid uses 2N-1 cells
// for N layout cells, so we work backwards from viewport size.
function computeViewportLayoutCap(diff) {
  var vw = (typeof window !== 'undefined' && window.innerWidth) ? window.innerWidth : 380;
  var vh = (typeof window !== 'undefined' && window.innerHeight) ? window.innerHeight : 700;

  // Target cell size by difficulty: Easy gets the biggest cells (less complex puzzles
  // can afford bigger cells); Hard accepts smaller cells in exchange for more equations.
  var targetCell = diff === 'easy' ? 40 : (diff === 'medium' ? 36 : 32);
  var minCell = 28; // hard floor

  // Reserved vertical space — must match the auto-fit math in renderGrid()
  var scoreBarReserve = (state && state.settings && state.settings.scoreMode) ? 40 : 0;
  // Bank rows: estimate based on equation count (more equations = more bank tiles = more rows)
  var cfg = DIFFICULTY[diff];
  var estBankTiles = cfg.numEquations * 2 + (cfg.decoyCount || 0); // rough
  var estBankRows = Math.max(1, Math.ceil(estBankTiles / 9));
  var bankReserve = 44 * estBankRows + 12;
  var baseReserve = 200; // top bar + diff pills + title + actions + footer + margins
  var availW = vw - 12;
  var availH = vh - baseReserve - scoreBarReserve - bankReserve;
  if (availH < 200) availH = 200;

  // How many visual cells fit at the target size (with floor)?
  function maxVisualAt(size) {
    return { cols: Math.floor(availW / size), rows: Math.floor(availH / size) };
  }
  var atTarget = maxVisualAt(targetCell);
  var atMin = maxVisualAt(minCell);

  // Prefer the larger of (rows fit at target, cols fit at target) so layout can be
  // either landscape-ish or portrait-ish. We'll cap to the smaller of fit dimensions.
  var visualCap = Math.min(atTarget.cols, atTarget.rows);
  // If visualCap is too low (would prevent puzzles from fitting numEquations), fall back to min cell
  if (visualCap < 9) visualCap = Math.min(atMin.cols, atMin.rows);

  // Convert visual cap to layout cap. visual = 2*layout - 1, so layout = (visual + 1) / 2
  var layoutCap = Math.floor((visualCap + 1) / 2);
  // Clamp to sensible range
  if (layoutCap < 5) layoutCap = 5;
  if (layoutCap > 9) layoutCap = 9;
  return layoutCap;
}

function generatePuzzle(diff, seedFn) {
  if (seedFn) R = seedFn;
  else R = Math.random;
  var cfg = DIFFICULTY[diff];

  // Arcade Tetris mode: stacked layout instead of irregular crossword.
  var arcadeMode = !!(state && state.settings && state.settings.arcadeMode);
  if (arcadeMode) {
    var numLayers = diff === 'easy' ? 4 : (diff === 'medium' ? 5 : 6);
    var stacked = generateStackedPuzzle(diff, cfg, numLayers);
    R = Math.random;
    if (stacked) return stacked;
    // Fall through to standard generation if stacked failed (rare)
  }

  // Override maxLayoutDim with viewport-aware computation.
  // Don't go below the difficulty's hard-coded minimum (some difficulties NEED room for their equations).
  var minLayoutDim = diff === 'easy' ? 5 : (diff === 'medium' ? 6 : 7);
  var dynamicCap = computeViewportLayoutCap(diff);
  var effectiveCap = Math.max(minLayoutDim, dynamicCap);
  // Mutate cfg's maxLayoutDim for this generation. Restore at end.
  var origMaxLayoutDim = cfg.maxLayoutDim;
  cfg.maxLayoutDim = effectiveCap;
  var maxAttempts = diff === 'hard' ? 600 : 250;
  for (var attempt = 0; attempt < maxAttempts; attempt++) {
    var layout = genLayout(cfg);
    if (layout.equations.length < cfg.numEquations) continue;
    var puzzle = assignValues(layout, cfg);
    if (!puzzle) continue;
    var givens = pickGivens(layout, puzzle, cfg.givenCount, cfg);
    if (!givens) continue;
    var decoys = pickDecoys(layout, puzzle, givens, cfg.decoyCount || 0, cfg);
    if (!decoys) continue;

    // SANITY CHECK: verify the bank we'd build supplies all needed values.
    var needCounts = {};
    var bankCounts = {};
    for (var sci = 0; sci < layout.cells.length; sci++) {
      var sk = layout.cells[sci];
      if (!givens[sk]) {
        var sv = puzzle.values[sk];
        needCounts[sv] = (needCounts[sv] || 0) + 1;
        bankCounts[sv] = (bankCounts[sv] || 0) + 1;
      }
    }
    for (var sdi = 0; sdi < decoys.length; sdi++) {
      bankCounts[decoys[sdi]] = (bankCounts[decoys[sdi]] || 0) + 1;
    }
    var bankOk = true;
    for (var nv in needCounts) {
      if ((bankCounts[nv] || 0) < needCounts[nv]) { bankOk = false; break; }
    }
    if (!bankOk) continue;

    R = Math.random;
    cfg.maxLayoutDim = origMaxLayoutDim;
    return { layout: layout, puzzle: puzzle, givens: givens, decoys: decoys, difficulty: diff };
  }
  R = Math.random;
  cfg.maxLayoutDim = origMaxLayoutDim;
  if (diff === 'hard') return generatePuzzle('medium', seedFn);
  if (diff === 'medium') return generatePuzzle('easy', seedFn);
  return null;
}

/* ========================================================================
   VISUAL GRID
======================================================================== */
function buildVisualGrid(layout, puzzle) {
  var visual = {};
  var maxVR = 0, maxVC = 0;
  for (var i = 0; i < layout.cells.length; i++) {
    var pp = layout.cells[i].split(',');
    var r = +pp[0], c = +pp[1];
    var vr = r * 2, vc = c * 2;
    visual[vr + ',' + vc] = { type: 'num', cellKey: layout.cells[i] };
    if (vr > maxVR) maxVR = vr;
    if (vc > maxVC) maxVC = vc;
  }
  for (var ei = 0; ei < layout.equations.length; ei++) {
    var eq = layout.equations[ei];
    var ops = puzzle.eqOps[ei];
    for (var k = 0; k < eq.cells.length - 1; k++) {
      var a = eq.cells[k].split(','); var b = eq.cells[k + 1].split(',');
      var midR = (+a[0]) + (+b[0]); var midC = (+a[1]) + (+b[1]);
      var sym = (k === eq.cells.length - 2) ? '=' : ops[k];
      visual[midR + ',' + midC] = { type: sym === '=' ? 'eq' : 'op', symbol: sym };
      if (midR > maxVR) maxVR = midR;
      if (midC > maxVC) maxVC = midC;
    }
  }
  return { cells: visual, rows: maxVR + 1, cols: maxVC + 1 };
}

/* ========================================================================
   STATE
======================================================================== */
var state = {
  difficulty: 'easy',
  isDaily: false,
  data: null, visual: null,
  placed: {}, selected: null, bank: [],
  shake: false, counted: false, hintUsed: false,
  hintNumber: null, hintCellKey: null,
  history: [],     // undo stack: array of {placed: {...}, selected: ...}
  generating: false,
  lastFilledKey: null,
  startTime: 0, elapsed: 0, timerInterval: null,
  showSolved: false, showStats: false, showSettings: false,
  // Score mode runtime state
  score: 0,
  multiplier: 1,
  combo: 0,
  comboExpiry: 0,
  clearedEqs: {},     // equation index -> true if it's been collapsed
  settledCells: {},   // cell key -> true if it's "locked" (part of cleared eq)
  scorePops: [],      // floating score popups currently visible
  hintsUsedCount: 0,
  resetsUsedCount: 0,
  // Arcade mode state
  arcadeEqsSolved: 0,    // total equations cleared across the run
  arcadeNextEqId: 1000,  // unique ids for equations we add dynamically
  arcadeBankTokens: {},  // bank tile id → value, so we can identify and remove specific tiles
  arcadeIncomingCells: {}, // cellKey → { fromX, fromY } for slide-in animation
  stats: {
    easy: { solved: 0, bestTime: null },
    medium: { solved: 0, bestTime: null },
    hard: { solved: 0, bestTime: null },
    streak: 0, lastSolveDate: null, dailySolved: {}
  },
  settings: {
    sound: true, dark: false, scoreMode: false, arcadeMode: false, mulDiv: false
  }
};

/* ========================================================================
   PERSISTENCE
======================================================================== */
function loadStats() {
  try {
    var raw = localStorage.getItem('cm-stats-v15');
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p === 'object') Object.assign(state.stats, p);
    }
    var s = localStorage.getItem('cm-settings-v15');
    if (s) {
      var ss = JSON.parse(s);
      if (ss && typeof ss === 'object') Object.assign(state.settings, ss);
    }
  } catch (e) {}
}
function saveStats() {
  try { localStorage.setItem('cm-stats-v15', JSON.stringify(state.stats)); } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem('cm-settings-v15', JSON.stringify(state.settings)); } catch (e) {}
}

/* ========================================================================
   THEME
======================================================================== */
function applyTheme() {
  document.documentElement.classList.toggle('dark', !!state.settings.dark);
}

/* ========================================================================
   SOUND
======================================================================== */
var audioCtx = null;
function ensureAudio() {
  if (audioCtx) return audioCtx;
  try {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (Ctor) audioCtx = new Ctor();
  } catch (e) {}
  return audioCtx;
}
function tone(freq, durMs, vol, type) {
  if (!state.settings.sound) return;
  var ctx = ensureAudio();
  if (!ctx) return;
  if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
  try {
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g); g.connect(ctx.destination);
    var now = ctx.currentTime;
    g.gain.linearRampToValueAtTime(vol || 0.08, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + (durMs / 1000));
    o.start(now); o.stop(now + (durMs / 1000) + 0.05);
  } catch (e) {}
}
function soundClick()    { tone(420, 60,  0.05, 'square'); }
function soundCorrect()  { tone(660, 80,  0.07, 'sine'); setTimeout(function(){tone(880,80,0.06,'sine');},80); }
function soundWrong()    { tone(220, 180, 0.07, 'sawtooth'); }
function soundClear()    {
  // Descending Tetris-style line-clear thunk
  if (!state.settings.sound) return;
  tone(800, 60, 0.08, 'square');
  setTimeout(function(){ tone(600, 60, 0.07, 'square'); }, 60);
  setTimeout(function(){ tone(400, 100, 0.07, 'square'); }, 120);
}
function soundCrossmath() {
  // Bigger fanfare for double clear
  if (!state.settings.sound) return;
  [523, 659, 784, 1047, 1318].forEach(function(f, i){
    setTimeout(function(){ tone(f, 100, 0.10, 'square'); }, i * 50);
  });
}
function soundSolve()    {
  if (!state.settings.sound) return;
  [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ tone(f, 220, 0.10, 'sine'); }, i * 110); });
}

/* ========================================================================
   PUZZLE LIFECYCLE
======================================================================== */
function startPuzzle(diff, isDaily) {
  state.difficulty = diff;
  state.isDaily = !!isDaily;
  state.generating = true;
  stopTimer();
  // Capture into local vars so concurrent calls don't clobber each other
  var capturedDiff = diff;
  var capturedDaily = !!isDaily;
  var thisInvocation = ++startPuzzle.token;
  render();
  setTimeout(function () {
    // If a newer startPuzzle was scheduled, abandon this one
    if (thisInvocation !== startPuzzle.token) return;
    var data;
    if (capturedDaily) {
      var seed = dailySeed(capturedDiff);
      data = generatePuzzle(capturedDiff, seedRng(seed));
    } else {
      data = generatePuzzle(capturedDiff);
    }
    if (thisInvocation !== startPuzzle.token) return; // race-checked again post-gen
    state.data = data;
    state.visual = buildVisualGrid(data.layout, data.puzzle);
    state.placed = {};
    state.selected = null;
    var bank = [];
    for (var i = 0; i < data.layout.cells.length; i++) {
      var k = data.layout.cells[i];
      if (!data.givens[k]) bank.push(data.puzzle.values[k]);
    }
    if (data.decoys) for (var di = 0; di < data.decoys.length; di++) bank.push(data.decoys[di]);
    bank.sort(function(a,b) { return a - b; });
    state.bank = bank;
    state.shake = false; state.counted = false; state.hintUsed = false;
    state.hintNumber = null; state.hintCellKey = null;
    state.lastFilledKey = null; state.generating = false;
    state.history = [];
    state.showSolved = false;
    state.elapsed = 0; state.startTime = Date.now();
    // Score mode reset
    state.score = 0;
    state.multiplier = 1;
    state.combo = 0;
    state.comboExpiry = 0;
    state.clearedEqs = {};
    state.settledCells = {};
    state.scorePops = [];
    state.hintsUsedCount = 0;
    state.resetsUsedCount = 0;
    state.arcadeEqsSolved = 0;
    state.arcadeNextEqId = 1000;
    startTimer();
    render();
  }, 30);
}
startPuzzle.token = 0;

function startTimer() {
  stopTimer();
  state.timerInterval = setInterval(function () {
    state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    var el = document.getElementById('timer-display');
    if (el) el.textContent = formatTime(state.elapsed);
  }, 1000);
}
function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
}
function formatTime(secs) {
  var m = Math.floor(secs / 60), s = secs % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function pushHistory() {
  // Snapshot of placed map
  var copy = {};
  for (var k in state.placed) if (state.placed[k] != null) copy[k] = state.placed[k];
  state.history.push({ placed: copy, selected: state.selected });
  if (state.history.length > 50) state.history.shift();
}
function undo() {
  if (state.history.length === 0) return;
  var prev = state.history.pop();
  state.placed = prev.placed;
  state.selected = prev.selected;
  state.lastFilledKey = null;
  render();
}
function reset() {
  pushHistory();
  // In score mode, only reset placed cells that aren't settled (cleared eqs are locked in)
  if (state.settings.scoreMode) {
    var newPlaced = {};
    for (var k in state.placed) if (state.settledCells[k]) newPlaced[k] = state.placed[k];
    state.placed = newPlaced;
    state.resetsUsedCount++;
  } else {
    state.placed = {};
  }
  state.selected = null;
  state.shake = false;
  state.lastFilledKey = null;
  state.hintNumber = null; state.hintCellKey = null; state.hintUsed = false;
  render();
}
function clearWrong() {
  var status = computeCellStatus();
  var changed = false;
  pushHistory();
  for (var k in state.placed) {
    if (state.settledCells[k]) continue; // never clear settled cells
    if (status[k] === 'wrong') { delete state.placed[k]; changed = true; }
  }
  if (changed) {
    state.lastFilledKey = null;
    state.selected = null;
    render();
  } else {
    state.history.pop();
  }
}
function newPuzzle() { startPuzzle(state.difficulty, state.isDaily); }
function useHint() {
  if (state.hintUsed) return;
  // Require an explicit cell selection. If no eligible cell is selected, do nothing
  // beyond a brief visual nudge — let the user pick where they need help.
  if (!state.selected || !state.data || state.data.givens[state.selected]
      || state.placed[state.selected] != null || state.settledCells[state.selected]) {
    // Pulse the hint button briefly to signal "select a cell first"
    var btn = document.querySelector('.action-btn.hint');
    if (btn) {
      btn.classList.add('reject');
      setTimeout(function() { if (btn) btn.classList.remove('reject'); }, 320);
    }
    return;
  }
  var targetKey = state.selected;
  state.hintNumber = state.data.puzzle.values[targetKey];
  state.hintCellKey = targetKey;
  state.hintUsed = true;
  if (state.settings.scoreMode) state.hintsUsedCount++;
  render();
}

function firstOpenKey() {
  if (!state.data) return null;
  for (var i = 0; i < state.data.layout.cells.length; i++) {
    var k = state.data.layout.cells[i];
    if (!state.data.givens[k] && state.placed[k] == null) return k;
  }
  return null;
}
function cellValue(key) {
  if (state.data.givens[key]) return state.data.puzzle.values[key];
  return state.placed[key] != null ? state.placed[key] : null;
}
function isComplete() {
  if (!state.data) return false;
  for (var i = 0; i < state.data.layout.cells.length; i++) {
    if (cellValue(state.data.layout.cells[i]) == null) return false;
  }
  return true;
}
function isSolved() {
  if (state.settings.arcadeMode) return false; // arcade is endless
  if (!isComplete()) return false;
  var p = state.data;
  for (var ei = 0; ei < p.layout.equations.length; ei++) {
    var eq = p.layout.equations[ei];
    if (eq.cells.length === 0) continue; // removed equation, skip
    var ops = p.puzzle.eqOps[ei];
    var vals = [];
    for (var ci = 0; ci < eq.cells.length; ci++) vals.push(cellValue(eq.cells[ci]));
    if (applyChain(vals.slice(0, vals.length - 1), ops) !== vals[vals.length - 1]) return false;
  }
  return true;
}
function checkAndCelebrate() {
  if (isSolved() && !state.counted) {
    state.counted = true;
    stopTimer();
    var diffStats = state.stats[state.difficulty];
    diffStats.solved = (diffStats.solved || 0) + 1;
    if (diffStats.bestTime == null || state.elapsed < diffStats.bestTime) {
      diffStats.bestTime = state.elapsed;
    }
    // Score-mode best score per difficulty
    if (state.settings.scoreMode) {
      var finalScore = computeFinalScore();
      state.lastFinalScore = finalScore;
      diffStats.bestScore = diffStats.bestScore || 0;
      if (finalScore > diffStats.bestScore) diffStats.bestScore = finalScore;
    }
    // Streak
    var today = todayKey();
    if (state.isDaily) {
      state.stats.dailySolved = state.stats.dailySolved || {};
      state.stats.dailySolved[today + ':' + state.difficulty] = state.elapsed;
    }
    var last = state.stats.lastSolveDate;
    if (last !== today) {
      if (last === yesterdayKey()) state.stats.streak = (state.stats.streak || 0) + 1;
      else state.stats.streak = 1;
      state.stats.lastSolveDate = today;
    }
    saveStats();
    soundSolve();
    launchFireworks();
    state.showSolved = true;
    setTimeout(render, 100);
  } else if (isComplete() && !isSolved()) {
    soundWrong();
    triggerShake();
  }
}

function countEmptyCells() {
  if (!state.data) return 0;
  var n = 0;
  for (var i = 0; i < state.data.layout.cells.length; i++) {
    var k = state.data.layout.cells[i];
    if (!state.data.givens[k] && !state.settledCells[k] && state.placed[k] == null) n++;
  }
  return n;
}

function scrollToFirstEmpty() {
  // If there's an empty cell off-screen, smoothly scroll the grid to bring it into view.
  var k = firstOpenKey();
  if (!k) return;
  var el = document.querySelector('[data-cell-key="' + k + '"]');
  if (!el) return;
  if (el.scrollIntoView) {
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); } catch (e) {}
  }
}

function computeFinalScore() {
  // Sum all per-equation clears + bonuses
  var baseClearScore = state.score;
  var noHintBonus = state.hintsUsedCount === 0 ? 200 : 0;
  var noResetBonus = state.resetsUsedCount === 0 ? 100 : 0;
  // Time bonus: faster = more, capped at 300
  var timeBonus = Math.max(0, 300 - state.elapsed * 2);
  return baseClearScore + noHintBonus + noResetBonus + Math.round(timeBonus);
}

function detectEquationClears(justFilledKey) {
  if (!state.settings.scoreMode || !state.data) return;
  var p = state.data;
  var newlyCleared = [];
  for (var ei = 0; ei < p.layout.equations.length; ei++) {
    if (state.clearedEqs[ei]) continue;
    var eq = p.layout.equations[ei];
    if (!eq.cells || eq.cells.length === 0) continue; // removed equation
    var vals = [];
    var allFilled = true;
    var allCorrect = true;
    for (var ci = 0; ci < eq.cells.length; ci++) {
      var v = cellValue(eq.cells[ci]);
      if (v == null) { allFilled = false; break; }
      vals.push(v);
      if (v !== p.puzzle.values[eq.cells[ci]]) allCorrect = false;
    }
    if (!allFilled || !allCorrect) continue;
    var ops = p.puzzle.eqOps[ei];
    if (applyChain(vals.slice(0, vals.length - 1), ops) !== vals[vals.length - 1]) continue;
    newlyCleared.push(ei);
  }
  if (newlyCleared.length === 0) return;

  // Combo + multiplier
  var now = Date.now();
  if (now > state.comboExpiry) {
    state.combo = 0;
    state.multiplier = 1;
  }
  state.combo += newlyCleared.length;
  state.multiplier = Math.min(5, 1 + Math.floor(state.combo / 2));
  state.comboExpiry = now + 5000;

  // Animate each cleared equation; score
  for (var nc = 0; nc < newlyCleared.length; nc++) {
    var idx = newlyCleared[nc];
    state.clearedEqs[idx] = true;
    var crossmath = (newlyCleared.length > 1 && nc === 0);
    animateEquationClear(p.layout.equations[idx], crossmath, nc * 80);
    var basePts = 100;
    var earned = basePts * state.multiplier;
    if (newlyCleared.length > 1) earned *= 2;
    state.score += earned;
    state.arcadeEqsSolved++;
    spawnScorePop(p.layout.equations[idx], earned, crossmath || newlyCleared.length > 1);
  }

  // Mark cells as settled (only matters in non-arcade score mode)
  if (!state.settings.arcadeMode) {
    for (var nc2 = 0; nc2 < newlyCleared.length; nc2++) {
      var eq2 = p.layout.equations[newlyCleared[nc2]];
      for (var c2 = 0; c2 < eq2.cells.length; c2++) {
        state.settledCells[eq2.cells[c2]] = true;
      }
    }
  }

  if (newlyCleared.length > 1) soundCrossmath();
  else soundClear();

  flashScoreBump();

  if (state.settings.arcadeMode) {
    setTimeout(function () {
      if (state.data && state.data.isStacked) {
        // Tetris-style: when a layer's horizontal eqs are all cleared, the layer
        // collapses, everything above drops, a fresh layer spawns at top.
        applyStackedClears();
      } else {
        // Legacy per-equation arcade replacement (fallback if stacked gen failed).
        for (var i = 0; i < newlyCleared.length; i++) {
          replaceArcadeEquation(newlyCleared[i]);
        }
      }
      render();
    }, 900);
  } else {
    setTimeout(render, 900);
  }
}

/* ========================================================================
   STACKED ARCADE: layer collapse, gravity, new-top spawn
======================================================================== */
function applyStackedClears() {
  // Process cleared layers one at a time, bottom-most first. After each
  // collapse, re-scan since rows shifted and indices changed.
  for (var safety = 0; safety < 50; safety++) {
    var p = state.data;
    if (!p || !p.layout.layers) return;
    var idx = -1, maxRow = -1;
    for (var li = 0; li < p.layout.layers.length; li++) {
      var layer = p.layout.layers[li];
      if (!layer || !layer.hEqIndices.length) continue;
      var allCleared = true;
      for (var hi = 0; hi < layer.hEqIndices.length; hi++) {
        if (!state.clearedEqs[layer.hEqIndices[hi]]) { allCleared = false; break; }
      }
      if (allCleared && layer.row > maxRow) { idx = li; maxRow = layer.row; }
    }
    if (idx === -1) return;
    collapseOneLayer(idx);
  }
}

function collapseOneLayer(layerIdx) {
  var p = state.data;
  var layer = p.layout.layers[layerIdx];
  if (!layer) return;

  // Cells to remove: hEq cells + connector cells of vEqs going up from this layer
  var removeSet = {};
  for (var hi = 0; hi < layer.hEqIndices.length; hi++) {
    var hEq = p.layout.equations[layer.hEqIndices[hi]];
    if (!hEq.cells) continue;
    for (var c = 0; c < hEq.cells.length; c++) removeSet[hEq.cells[c]] = true;
  }
  for (var vi = 0; vi < layer.vEqIndicesUp.length; vi++) {
    var vEq = p.layout.equations[layer.vEqIndicesUp[vi]];
    if (vEq.cells && vEq.cells[1]) removeSet[vEq.cells[1]] = true;
  }

  // ALSO: vEqs going DOWN from this layer (top cell in this layer's hEq, bottom
  // in the layer below). Those are in the next-layer-down's vEqIndicesUp. Their
  // top cell is being removed (above), so the vEq becomes broken — clear it AND
  // remove its connector middle cell (which only existed for that vEq).
  // Without this, after a middle-layer collapse you get zombie vEqs referencing
  // cells that no longer exist (v44c fix — caught via user debug dump).
  var clearedRow = layer.row;
  var brokenVEqIndices = [];
  var layerBelow = null;
  for (var lb = 0; lb < p.layout.layers.length; lb++) {
    if (lb === layerIdx) continue;
    if (p.layout.layers[lb].row === clearedRow + 2) {
      layerBelow = p.layout.layers[lb];
      break;
    }
  }
  if (layerBelow) {
    for (var vk = 0; vk < layerBelow.vEqIndicesUp.length; vk++) {
      var bvEqIdx = layerBelow.vEqIndicesUp[vk];
      var bvEq = p.layout.equations[bvEqIdx];
      if (bvEq && bvEq.cells && bvEq.cells[1]) removeSet[bvEq.cells[1]] = true;
      brokenVEqIndices.push(bvEqIdx);
    }
    layerBelow.vEqIndicesUp = []; // detach — those vEqs are gone now
  }

  // Remove from cells, values, givens, placed, settled
  p.layout.cells = p.layout.cells.filter(function (k) { return !removeSet[k]; });
  for (var rk in removeSet) {
    delete p.puzzle.values[rk];
    delete p.givens[rk];
    delete state.placed[rk];
    delete state.settledCells[rk];
  }

  // Mark removed equations as empty (so other code skips them)
  for (var hi2 = 0; hi2 < layer.hEqIndices.length; hi2++) {
    p.layout.equations[layer.hEqIndices[hi2]] = { cells: [], orientation: 'h' };
    p.puzzle.eqOps[layer.hEqIndices[hi2]] = [];
    delete state.clearedEqs[layer.hEqIndices[hi2]];
  }
  for (var vi2 = 0; vi2 < layer.vEqIndicesUp.length; vi2++) {
    p.layout.equations[layer.vEqIndicesUp[vi2]] = { cells: [], orientation: 'v' };
    p.puzzle.eqOps[layer.vEqIndicesUp[vi2]] = [];
  }
  for (var bvi = 0; bvi < brokenVEqIndices.length; bvi++) {
    p.layout.equations[brokenVEqIndices[bvi]] = { cells: [], orientation: 'v' };
    p.puzzle.eqOps[brokenVEqIndices[bvi]] = [];
  }

  // Drop layer from layers metadata
  p.layout.layers.splice(layerIdx, 1);

  // Apply gravity: shift cells ABOVE the cleared row DOWN by 2.
  // Cells at or below the cleared row stay in place.
  shiftCellsAboveRow(clearedRow, 2);

  // Update layers metadata rows for layers above the cleared row
  for (var lk = 0; lk < p.layout.layers.length; lk++) {
    if (p.layout.layers[lk].row < clearedRow) p.layout.layers[lk].row += 2;
  }

  // Spawn a fresh layer at the top
  spawnNewTopLayer();

  // Bridge the now-adjacent layers across the gap left by the cleared layer.
  // Without this, the layer that just dropped to clearedRow is disconnected
  // from the layer at clearedRow+2 — feels like floating islands. A fresh vEq
  // restores the "connected tree" feel.
  reconnectAcrossGap(clearedRow);

  recomputeBounds(p.layout);
  state.visual = buildVisualGrid(p.layout, p.puzzle);
}

/* After a middle-layer collapse + gravity, two layers that weren't adjacent
   before are now adjacent (rows clearedRow and clearedRow+2). They have no
   vEq between them. Build one. The connector cell is GIVEN (auto-filled, no
   bank tile needed) — its only purpose is visual + structural connectivity. */
function reconnectAcrossGap(clearedRow) {
  var p = state.data;
  if (clearedRow === 0) return; // top collapse — no layer dropped down to bridge

  var topLayer = null;     // formerly at clearedRow-2, now at clearedRow
  var bottomLayer = null;  // unchanged, at clearedRow+2
  for (var li = 0; li < p.layout.layers.length; li++) {
    var L = p.layout.layers[li];
    if (L.row === clearedRow) topLayer = L;
    else if (L.row === clearedRow + 2) bottomLayer = L;
  }
  if (!topLayer || !bottomLayer) return;
  if (!topLayer.hEqIndices.length || !bottomLayer.hEqIndices.length) return;

  var topHEq = p.layout.equations[topLayer.hEqIndices[0]];
  var bottomHEq = p.layout.equations[bottomLayer.hEqIndices[0]];
  if (!topHEq.cells.length || !bottomHEq.cells.length) return;

  // Try every column where both layers have a cell. Prefer columns that
  // don't already have a cell at (clearedRow-1) or (clearedRow+3) (anti-chain),
  // and where top OP middle = bottom yields a valid middle in [1, maxNum].
  var topCols = topHEq.cells.map(function (k) { return +k.split(',')[1]; });
  var bottomCols = bottomHEq.cells.map(function (k) { return +k.split(',')[1]; });
  var shared = topCols.filter(function (c) { return bottomCols.indexOf(c) !== -1; });
  if (!shared.length) return;
  var occAbove = {}, occBelow = {};
  for (var ci = 0; ci < p.layout.cells.length; ci++) {
    var pp = p.layout.cells[ci].split(',');
    var r = +pp[0], c = +pp[1];
    if (r === clearedRow - 1) occAbove[c] = true;
    if (r === clearedRow + 3) occBelow[c] = true;
  }
  var cfg = DIFFICULTY[state.difficulty];

  // Build candidates with valid math, sorted by anti-chain safety
  var candidates = [];
  for (var si = 0; si < shared.length; si++) {
    var c = shared[si];
    var tk = clearedRow + ',' + c;
    var bk = (clearedRow + 2) + ',' + c;
    var tv = p.puzzle.values[tk];
    var bv = p.puzzle.values[bk];
    if (tv == null || bv == null) continue;
    var cOp = null, cMid = null;
    if (bv > tv) {
      var m1 = bv - tv;
      if (m1 >= 1 && m1 <= cfg.maxNum) { cOp = '+'; cMid = m1; }
    }
    if (cOp == null && tv > bv) {
      var m2 = tv - bv;
      if (m2 >= 1 && m2 <= cfg.maxNum) { cOp = '−'; cMid = m2; }
    }
    if (cOp == null) continue;
    candidates.push({ col: c, op: cOp, mid: cMid, safe: !occAbove[c] && !occBelow[c] });
  }
  if (!candidates.length) return; // no column allows valid math

  candidates.sort(function (a, b) { return (b.safe ? 1 : 0) - (a.safe ? 1 : 0); });
  var pick = candidates[0];
  var connectorCol = pick.col;
  var op = pick.op;
  var midValue = pick.mid;
  var topCellKey = clearedRow + ',' + connectorCol;
  var bottomCellKey = (clearedRow + 2) + ',' + connectorCol;

  // Add the connector cell + vEq. Mark connector as given (visual-only bridge,
  // no bank tile needed, no extra deduction step for the player).
  var connectorCellKey = (clearedRow + 1) + ',' + connectorCol;
  p.layout.cells.push(connectorCellKey);
  p.puzzle.values[connectorCellKey] = midValue;
  p.givens[connectorCellKey] = true;
  var newVEqIdx = p.layout.equations.length;
  p.layout.equations.push({
    cells: [topCellKey, connectorCellKey, bottomCellKey],
    orientation: 'v'
  });
  p.puzzle.eqOps.push([op]);
  bottomLayer.vEqIndicesUp.push(newVEqIdx);

  // Slide-in animation tag for the new connector cell
  state.arcadeIncomingCells = state.arcadeIncomingCells || {};
  state.arcadeIncomingCells[connectorCellKey] = { fromX: '0px', fromY: '-30px' };
}

function shiftCellsAboveRow(thresholdRow, delta) {
  var p = state.data;
  function shiftKey(k) {
    var pp = k.split(',');
    var r = +pp[0];
    if (r >= thresholdRow) return k;
    return (r + delta) + ',' + (+pp[1]);
  }
  p.layout.cells = p.layout.cells.map(shiftKey);
  for (var ei = 0; ei < p.layout.equations.length; ei++) {
    var eq = p.layout.equations[ei];
    if (!eq.cells || eq.cells.length === 0) continue;
    eq.cells = eq.cells.map(shiftKey);
  }
  var newValues = {}, newGivens = {}, newPlaced = {}, newSettled = {};
  for (var vk in p.puzzle.values) newValues[shiftKey(vk)] = p.puzzle.values[vk];
  for (var gk in p.givens) if (p.givens[gk]) newGivens[shiftKey(gk)] = true;
  for (var pk in state.placed) if (state.placed[pk] != null) newPlaced[shiftKey(pk)] = state.placed[pk];
  for (var sk in state.settledCells) if (state.settledCells[sk]) newSettled[shiftKey(sk)] = true;
  p.puzzle.values = newValues;
  p.givens = newGivens;
  state.placed = newPlaced;
  state.settledCells = newSettled;
}

function spawnNewTopLayer() {
  var p = state.data;
  if (!p.layout.layers.length) return;

  // After gravity, the existing top layer is at row 2 (was at row 0 before gravity)
  // Sort layers by row ascending; topmost is at smallest row
  p.layout.layers.sort(function (a, b) { return a.row - b.row; });
  var topLayer = p.layout.layers[0];
  if (topLayer.row !== 2) return; // unexpected — bail out, no spawn

  var topHEq = p.layout.equations[topLayer.hEqIndices[0]];
  if (!topHEq.cells || !topHEq.cells.length) return;

  // Pick connector column from the top hEq cells. Avoid the column where
  // there's already a cell at row 3 (would create a 4+ chain at that column).
  var topHCols = topHEq.cells.map(function (k) { return +k.split(',')[1]; });
  var occupiedAtRow3 = {};
  for (var ci = 0; ci < p.layout.cells.length; ci++) {
    var pp = p.layout.cells[ci].split(',');
