name: bladecam

on:
  push:
    paths:
      - 'bladecam/**'
      - '.github/workflows/bladecam.yml'
  pull_request:
    paths:
      - 'bladecam/**'
      - '.github/workflows/bladecam.yml'

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bladecam
    steps:
      - uses: actions/checkout@v4

      - name: Set up Fortran (gfortran)
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (numpy + matplotlib; OpenCASCADE best-effort)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib
          python -m pip install cadquery-ocp || echo "OCC unavailable; CAD tests will skip"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Debug build with runtime checks (-fcheck=all)
        run: |
          cmake -S . -B build_dbg -DCMAKE_BUILD_TYPE=Debug
          cmake --build build_dbg -j
          ctest --test-dir build_dbg --output-on-failure
