[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bladecam"
version = "0.5.0"
description = "5-axis flank-milling tool-positioning toolkit for impeller blades"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gui = ["PySide6>=6.5", "pyvista>=0.43", "pyvistaqt>=0.11", "matplotlib>=3.7"]
cad = ["cadquery-ocp>=7.7"]   # STEP / IGES import
pkg = ["pyinstaller>=6.0"]    # desktop bundle

[project.scripts]
bladecam-demo = "demo:main"
bladecam-gui = "bladecam.viewer:main"
bladecam-benchmark = "benchmark:main"

[tool.setuptools]
package-dir = { "" = "python" }
# demo.py / benchmark.py live at python/ (top level) and back the bladecam-demo /
# bladecam-benchmark entry points, so they must be installed as py-modules.
py-modules = ["demo", "benchmark"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["bladecam*"]

# NOTE: the Fortran core (libbladecam) is built separately with CMake; see
# README. Set BLADECAM_LIB or place the build under bladecam/build/core.
